validation:
- rule: Every event must have exactly one uec_code from this taxonomy.
- rule: UEC codes are immutable once assigned. New types get new codes.
- rule: regulatory_pools on the event must be a subset of the event_type's regulatory_pools.
- rule: product_origin must include the product_id writing the event.
- rule: QR color must match the category's uec_color.
- rule: A type with status duplicate (see duplicate_of) or excluded_regime is not offered for new events. Its code stays reserved, so events already written under it remain valid.
- rule: A type without a phase key is a Phase 1 type. total_types_v1 must equal the number of Phase 1 types, and total_types must equal the number of all types.
- rule: When an event carries a heritage, language or community label, the organizer chooses it. It is never part of a type id, type name or UEC code, and it is never inferred from who attends. The event record that holds the label is defined by the product that writes the event.
