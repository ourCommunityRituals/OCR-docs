# ============================================================================
# OCR DATA EDGES — every allowed link between products
# ============================================================================
# One list of every link that carries data, code or rules from one OCR product
# to another. A data link that is not listed here is not allowed.
#
# This file is an INDEX, not the contract. What may cross each data link, field
# by field, stays in docs/architecture/OCR_ARCHITECTURE_oerAggregationBoundary.md
# (OCR-ENF-24), and the invariants in architectural-invariants.yaml stay the
# rules. Each edge points at those homes; it does not copy them.
#
# Why one list: the links were described in several places (the boundary doc,
# invariants #17 and #22, OSE ADR-011, ADR-033 and ADR-040, ourWKRP code). Read
# together on 2026-11-24 they did not agree: see `open_questions` at the end.
#
# How each `status` was read (2026-11-24, from the default branch of each repo):
#   built          code for the link is on the repo's main branch
#   served_only    one side serves it; no caller was found on the other side
#   switched_off   built, and off by config in every environment
#   contract_only  written in the boundary doc; no code on either side
#   decided        an owner decision exists; not built
#   proposed       written down, awaiting the owner
# None of these says the link is running on staging. "Built" is code on main.
#
# Commits read: OCR-docs 70c8a0b, ourSharedEvents 9537680, ourWKRP 08841f4,
# ourEventRings ea20fa1, ourCommunityRituals f6c6c3d.
#
# Edges carry dates so the graph keeps its history: `since` is when the link
# was first written down or built, the earliest date found in the sources named
# in `evidence` (some repo histories were re-imported, so a git date can be later
# than the real start); `retired` (absent while the link stands) closes it. An edge is never deleted, only retired, and its id is never reused.
# ============================================================================

schema_version: 1.0.0
last_verified: 2026-11-26

# The nodes. `product_id` matches product-registry.yaml where the product is
# registered. ourEventRings and the hub are not product records there, so they
# carry their own ids here.
nodes:
  - id: ocr-docs
    repo: ourCommunityRituals/OCR-docs
    side: governance
  - id: hub
    repo: ourCommunityRituals/ourCommunityRituals
    side: shared_code
  - id: ose
    repo: ourCommunityRituals/ourSharedEvents
    side: anonymous
  - id: osm
    repo: ourCommunityRituals/ourSharedMagnets
    side: anonymous
  - id: wkrp
    repo: ourCommunityRituals/ourWKRP
    side: named
  - id: oaw
    repo: ourCommunityRituals/ourAirwaves
    side: named
  - id: osg
    repo: ourCommunityRituals/ourSharedGames
    side: pre_tech
  - id: osp
    repo: ourCommunityRituals/ourSharedPulse
    side: pre_tech
  - id: osr
    repo: ourCommunityRituals/ourSharedRecords
    side: pre_tech
  - id: oer
    repo: ourCommunityRituals/ourEventRings
    side: intelligence
  # Agents (added 2026-11-26, security re-sweep base item 1). Not products:
  # they are the actors that read and change the products. Brain-local ids.
  - id: cloud-agents
    repo: null
    side: agent
    note: Claude Code cloud sessions (project threads). GitHub, and any cloud credentials, reach them through the session proxy.
  - id: ci-agents
    repo: null
    side: agent
    note: Claude jobs inside GitHub Actions (PR review, @claude respond).
  - id: workstation-agents
    repo: null
    side: agent
    note: Claude Code on the owner's own machine, where the OSE policy-gate hook is installed.
  - id: agent-memory
    repo: null
    side: agent
    note: Shared team memory and the project files folder, written and read by every thread.

# kind:
#   data        rows or counts cross (the privacy-relevant kind)
#   code        a shared package or pinned commit is consumed
#   governance  rules, standards or checks flow from the brain
#   agent       an agent can read, write or run something in the product, or
#               holds a credential for it. Each agent edge says which
#               credentials it carries (`credentials`). A live one names what
#               limits it (`enforced_by`) or an open question that says nothing
#               does yet.
# privacy_class (data edges only): A, B or X as defined in the boundary doc
# section 3; "public" for a read of what a public page already shows.
edges:

  # ── Data: products to ourEventRings ────────────────────────────────────────
  - id: E1
    from: ose
    to: oer
    kind: data
    what: >
      Batch export to BigQuery: events_backup (the event index row),
      corridor_density_baseline_export, event_series_export and
      corridor_flow_export. A schema for corridor_returns_export exists; the
      export code says that table receives nothing yet.
    privacy_class: A
    floor: Under-5 floor and corridor (res 7) grain per the boundary doc 4.1, 4.1.1 and 4.1.2
    status: built
    since: 2026-05-15
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.1
    enforced_by:
      - "invariant #17 (oer-emission-boundary.invariant.spec.ts in OSE)"
    evidence: >
      ourSharedEvents workers/oursharedevents/bigquery/*.schema.json (5 files);
      src/lib/shared-report-export.ts, src/lib/corridor-flow-export.ts,
      src/cloud/bigquery.ts. `since` is the OSE-272 SharedReport export work
      (transcripts, May 2026).

  - id: E2
    from: wkrp
    to: oer
    kind: data
    what: Curation signals, community engagement counts and named profile signals.
    privacy_class: B
    floor: Aggregate only at aggregate level; revocation reaches OER within 24 h
    status: contract_only
    since: 2026-08-02
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.2
    enforced_by: []
    evidence: Boundary doc 4.2. No BigQuery export found in ourWKRP src.

  - id: E3
    from: oaw
    to: oer
    kind: data
    what: Deployment registry telemetry (deployment id, corridor, tier, activation date).
    privacy_class: A
    floor: No client data crosses
    status: contract_only
    since: 2026-08-02
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.3
    enforced_by: []
    evidence: Boundary doc 4.3. ourAirwaves holds documents only.

  - id: E4
    from: osm
    to: oer
    kind: data
    what: As written in the boundary doc for OSM.
    privacy_class: A
    floor: As the boundary doc sets
    status: contract_only
    since: 2026-08-02
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md (OSM section)
    enforced_by: []
    evidence: Boundary doc scope line lists OSM. ourSharedMagnets holds documents only.

  # ── Data: between ourSharedEvents and ourWKRP (HTTP only) ──────────────────
  - id: E5
    from: wkrp
    to: ose
    kind: data
    direction_note: ourWKRP serves; OSE was meant to call it.
    what: "GET /api/events/:eventId/music on ourWKRP: an event's sets, top tracks and floored counts."
    privacy_class: B
    floor: Floored counts; no listener identity
    status: served_only
    since: 2026-08-02
    contract: "invariant #22 permitted seam; boundary doc section 2"
    enforced_by:
      - "invariant #22 (check_cross_repo_imports.py)"
      - "Pact at the music seam (OSE-423)"
    evidence: >
      ourWKRP src/router.ts line 368 serves it. No caller found in
      ourSharedEvents workers/oursharedevents/src (searched for "/music",
      "ourwkrp" and "WKRP" at 9537680).

  - id: E6
    from: ose
    to: wkrp
    kind: data
    direction_note: OSE serves; ourWKRP was meant to call it with a service token.
    what: "POST /api/v2/events/shared-reports/batch on OSE: SharedReports for a batch of events."
    privacy_class: A
    floor: The SharedReport's own floors (OSE ADR-017)
    status: served_only
    since: 2026-05-15
    contract: "OSE ADR-011 (SharedReport is the boundary ourWKRP consumes); invariant #22 permitted seam"
    enforced_by:
      - "WKRP_SERVICE_TOKEN, cross_product class, fails closed (OSE src/lib/shared-report-auth.ts)"
    evidence: >
      OSE src/router.ts line 2557 serves it. No caller found in ourWKRP src
      (searched for "shared-reports" at 08841f4).

  - id: E7
    from: ose
    to: wkrp
    kind: data
    direction_note: ourWKRP's private creator showcase reads OSE at build time.
    what: >
      Public reads at build time: /api/v2/events?brand=, /api/v2/events/:id,
      its poster-bundle and sponsor-bundle (surface=public), the brand
      calendar.ics, and /api/v2/map/areas (OSE ADR-033). Staging or a local
      OSE only; never production.
    privacy_class: public
    floor: Only what OSE's public pages already show
    status: built
    since: 2026-11-12
    contract: "OSE ADR-033 (the area map as a public read of cells); public event projection (OSE AGENTS.md); invariant #22 permitted seam"
    enforced_by:
      - "OSE public read rate limit (lib/public-read-limit.ts)"
      - "ourWKRP showcase stops the build on any text naming the creator"
    evidence: ourWKRP showcase/lib/ose.mjs (header lists the reads; OSE_STAGING only).

  - id: E8
    from: wkrp
    to: ose
    kind: data
    direction_note: ourWKRP opens a song on an OSE vote set when a DJ logs a play.
    what: >
      A song label only, sent to /api/v2/admin/events/:id/votables. No ourWKRP
      id, DJ or contributor name crosses. ourWKRP keeps only the returned link.
      The vote itself stays on OSE and on site: a voter scans the room's code
      at the event (OSE ADR-040 decisions 6 and 12).
    privacy_class: A
    floor: Votes are counters on objects, never rows about voters (OSE ADR-040)
    status: switched_off
    since: 2026-11-23
    contract: "OSE ADR-040 (decision 12: any event type, on site only); OW-219; invariant #22 permitted seam"
    enforced_by:
      - "Cloudflare Access service token set by the owner"
      - "OSE_VOTE_LINK = \"off\" in ourWKRP wrangler.toml"
    evidence: ourWKRP src/lib/ose-vote-link.ts (added 2026-11-23); wrangler.toml line 109. OSE ADR-040 accepted 2026-11-18.

  - id: E9
    from: ose
    to: oer
    kind: data
    direction_note: Lets ourWKRP join its events to OSE's inside OER by two identity keys.
    what: venue_canonical_id and event_correlation_id on the event index row of a listed event.
    privacy_class: A
    floor: Keys only; no count at event or venue grain
    status: decided
    since: 2026-10-04
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.1.1 (decision A1)
    enforced_by: []
    evidence: Boundary doc 4.1.1 says neither key is emitted yet (OSE-1615, OSE-1617).

  - id: E10
    from: oer
    to: ose
    kind: data
    direction_note: The answer side of "products emit, OER answers".
    what: Cross-product answers through an OER API.
    privacy_class: A
    floor: Readers internal and named (OSE ADR-026 rule A, proposed)
    status: proposed
    since: 2026-08-02
    contract: "Boundary doc section 2; OSE ADR-026"
    enforced_by: []
    evidence: >
      ourEventRings computes the NCR layers from rows shaped like
      corridor_flow_export, read from CSV files (ncr/__main__.py); no API.

  # ── Data: ourAirwaves, the self-serve front door (decided 2026-11-26) ──────
  # OA configures OSE and OW pages through their APIs, never their databases.
  # Configuration and the use of a brand's own allowance cross; people never do.

  - id: E11
    from: oaw
    to: ose
    kind: data
    direction_note: OA writes; OSE checks and stores.
    what: >
      A brand's looks (the skin .md format), its tier limits, and an opaque OA actor id for OSE's audit log, sent with a brand-scoped OA service token. No name or email of the OA user crosses.
    privacy_class: A
    floor: No person data crosses; OSE refuses any look that breaks its rails
    status: decided
    since: 2026-11-25
    contract: "docs/proposals/PROPOSAL_ourAirwaves-self-serve.md sections 4, 6 and 7"
    enforced_by: []
    evidence: Owner decision 2026-11-26 (Matt, yes to D1-D7 of the proposal). Not built; ourAirwaves holds no code.

  - id: E12
    from: oaw
    to: wkrp
    kind: data
    direction_note: OA writes; ourWKRP checks and stores.
    what: >
      A brand's or contributor's looks (the skin .md format) and tier limits, sent with a brand-scoped OA service token.
    privacy_class: B
    floor: Named side; ourWKRP refuses any look that breaks its rails
    status: decided
    since: 2026-11-25
    contract: "docs/proposals/PROPOSAL_ourAirwaves-self-serve.md sections 4, 6 and 7"
    enforced_by: []
    evidence: Owner decision 2026-11-26 (Matt, yes to D1-D7 of the proposal). Not built; ourAirwaves holds no code.

  - id: E13
    from: ose
    to: oaw
    kind: data
    direction_note: OA reads back what it configured.
    what: >
      The brand's current looks and how much of each limit is used (for example 7 of 10 poster designs). No attendee data and no attendee counts; a SharedReport stays on OSE and OA only links to it.
    privacy_class: A
    floor: Configuration and allowance use only; never a count of people
    status: decided
    since: 2026-11-25
    contract: "docs/proposals/PROPOSAL_ourAirwaves-self-serve.md section 7"
    enforced_by: []
    evidence: Owner decision 2026-11-26 (Matt, yes to D1-D7 of the proposal). Not built.

  - id: E14
    from: wkrp
    to: oaw
    kind: data
    direction_note: OA reads back what it configured.
    what: >
      The brand's current looks and how much of each limit is used.
    privacy_class: B
    floor: Configuration and allowance use only
    status: decided
    since: 2026-11-25
    contract: "docs/proposals/PROPOSAL_ourAirwaves-self-serve.md section 7"
    enforced_by: []
    evidence: Owner decision 2026-11-26 (Matt, yes to D1-D7 of the proposal). Not built.

  # ── Code: the shared design system ─────────────────────────────────────────
  - id: C1
    from: hub
    to: [ose, wkrp, oer, oaw, osm, osg, osp, osr, ocr-docs]
    kind: code
    what: "@ocr/ui and the design check, pinned to an exact hub commit in .ocr-hub-ref."
    status: built
    since: 2026-07-01
    contract: "Invariant #22 permits shared OCR packages (@ocr/ui, @ocr/flags)"
    enforced_by:
      - "scripts/ci-stage-ocr-workspace.sh refuses a pin not on hub main"
    evidence: >
      .ocr-hub-ref present on main in all nine listed repos (read 2026-11-24).
      `since`: the shared design system reached OSE in July 2026 (transcripts
      master-timeline).

  # ── Governance: the brain to the spokes ────────────────────────────────────
  - id: G1
    from: ocr-docs
    to: [ose, wkrp, oaw, osm, osg, osp, osr]
    kind: governance
    what: >
      The brain conformance check reads this brain live from OCR-docs main,
      and standards are copied into each spoke's .ocr-standards/.
    status: built
    since: 2026-09-12
    contract: OCR_STANDARD_orgBrainSync.md
    enforced_by:
      - "brain-contract-check.yml in each listed spoke"
      - "propagate-standards.yml and nightly-sync-check.yml in OCR-docs"
    evidence: >
      brain-contract-check workflow and .ocr-standards present on main in the
      seven listed repos; absent in ourEventRings (read 2026-11-24). `since`:
      first commit of propagate-standards.yml in OCR-docs.

  # ── Agents: who can act on the products (security re-sweep 2026-11-26) ────
  # The data, code and governance edges above say what flows between products.
  # These say which agents can change or read them, because most of the High
  # findings in the 2026-11-25 sweep sat on links that were not listed anywhere.
  - id: A1
    from: cloud-agents
    to: [ose, wkrp, ocr-docs, hub, oer, oaw, osm, osg, osp, osr]
    kind: agent
    what: >
      Push to claude/* branches and open pull requests. A same-repository pull
      request runs CI with repository secrets, so the "fork PRs get no secrets"
      rule does not apply to agent branches.
    credentials: GitHub token through the session proxy, scoped to the repositories the project grants; PRs are authored under the owner's login.
    status: built
    since: 2026-11-01
    contract: "Each repo's CLAUDE.md (push only to the session branch; merges are a person's)"
    enforced_by:
      - "Claude review reads its instructions from the base branch (OSE claude-review.yml, ourWKRP claude-code-review.yml)"
      - "@claude respond jobs load user settings only (--setting-sources user)"
      - "OSE ci-integrity floor (.ci-integrity-baseline.json readUsesOnNewSecret)"
      - "CODEOWNERS on workflow and agent paths (binds once code-owner review is on)"
    evidence: >
      Security sweeps 2026-11-25 (H1, M8) and 2026-11-26 (run 4), in the
      transcripts project. `since` is the earliest project thread push read.

  - id: A2
    from: ci-agents
    to: [ose, wkrp]
    kind: agent
    what: Review a pull request and answer @claude comments, posting to the PR.
    credentials: ANTHROPIC_API_KEY repo secret; PR comment write; ourWKRP's @claude job also trades an OIDC token for the Claude GitHub App token.
    status: built
    since: 2026-08-01
    contract: "OSE ADR-020 (CI approval gate); OW-227"
    enforced_by:
      - "trusted-actor gate on @claude (OWNER, MEMBER, COLLABORATOR)"
      - "actions pinned by commit (ourWKRP action-pinning.invariant.spec.ts; OSE check-action-pins)"
      - "ourWKRP claude-workflow-hardening.invariant.spec.ts"
    evidence: >
      ourSharedEvents .github/workflows/claude-review.yml; ourWKRP
      .github/workflows/claude-code-review.yml and claude.yml (main, 2026-11-26).

  - id: A3
    from: workstation-agents
    to: [ose, wkrp]
    kind: agent
    what: Run local commands, including ones started through a secret runner such as doppler run.
    credentials: Whatever is signed in on that machine (Doppler, wrangler, gh).
    status: built
    since: 2026-09-01
    contract: "OSE AGENTS.md, Human approval (an agent never deploys, writes remote D1 or reads secrets)"
    enforced_by:
      - "OSE .claude/hooks/policy-gate.mjs (reads through doppler run and op run; installed by the owner)"
      - "ourWKRP .claude/settings.json (doppler asks; remote D1 and deploys denied)"
    evidence: >
      Owner standing order 2026-11-14 keeps agent work off the owner's machine,
      which lowers likelihood. OSE-2230, OW-229.

  - id: A4
    from: cloud-agents
    to: oer
    kind: agent
    what: Read the BigQuery analytic dataset.
    credentials: "None wanted. A Google Cloud credential was still present in the cloud environment on 2026-11-26 (see Q4)."
    status: decided
    since: 2026-11-26
    contract: "OSE ADR-026 rule A (who may read), not built"
    enforced_by: []
    evidence: >
      Owner ruling 2026-11-26: "The only thing Google Cloud gets is BigQuery
      access once I have data to pipe in from prod". The pipe gets its own
      write-only account; agents read only after rule A is built.

  - id: A5
    from: cloud-agents
    to: agent-memory
    kind: agent
    what: Read and write shared memory and project files that later threads follow, including lines recorded as owner decisions.
    credentials: Session file access; no separate credential.
    status: built
    since: 2026-11-01
    contract: "None yet (security sweep D7: an owner decision must link to the owner's own message)"
    enforced_by: []
    evidence: Security sweep 2026-11-25, finding M1. See Q5.

# Spokes with no data edge yet. A spoke adds its rows above before it writes
# code that sends or reads another product's data.
no_data_edges_yet:
  - id: osg
    note: Inherits OSE's anonymous model; its game data would flow through OSE, not beside it.
  - id: osp
    note: No anonymous id by design (human-delivered). It must never get a data edge to the anonymous side.
  - id: osr
    note: Archive and oral history; named by consent when built.

# Disagreements found while building this list. Each needs an owner ruling;
# this file does not settle them.
# Answered by the owner on 2026-11-24 (Q1 and Q2 of OCR-docs#187): every
# built link between OSE and ourWKRP is allowed, because voting works across
# any event type, on site only. E5 to E8 are now invariant #22's permitted
# seams (architectural-invariants.yaml, references.permitted_seams), and level 2
# fails if that list and the OSE–ourWKRP data edges here disagree. The music
# seam (E5) is kept.
open_questions:
  - id: Q3
    about: [G1]
    question: >
      ourEventRings has no brain conformance check and no .ocr-standards copy.
      Should it join G1 now that it holds code?

  - id: Q4
    about: [A4]
    question: >
      The cloud agent environment still carries a Google Cloud and an AWS
      credential (names seen 2026-11-26; values are proxy placeholders). Owner
      ruling 2026-11-26: Google Cloud is for BigQuery only, from prod, and AWS
      is not used (no AWS code in any OCR repo). Remove both from the
      environment's Network secrets; then A4 stays `decided` with no credential.
  - id: Q5
    about: [A5]
    question: >
      Nothing checks that a line saved to shared memory as an owner decision
      came from the owner. Adopt the rule that it must link to the owner's own
      message (security sweep D7)?
