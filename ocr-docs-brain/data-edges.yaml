# ============================================================================
# OCR DATA EDGES — every allowed link between products
# ============================================================================
# One list of every link that carries data, code or rules from one OCR product
# to another. A data link that is not listed here is not allowed.
#
# This file is an INDEX, not the contract. What may cross each data link, field
# by field, stays in docs/architecture/OCR_ARCHITECTURE_oerAggregationBoundary.md
# (OCR-ENF-24), and the invariants in architectural-invariants.yaml stay the
# rules. Each edge points at those homes; it does not copy them.
#
# Why one list: the links were described in several places (the boundary doc,
# invariants #17 and #22, OSE ADR-011, ADR-033 and ADR-040, ourWKRP code). Read
# together on 2026-11-24 they did not agree: see `open_questions` at the end.
#
# How each `status` was read (2026-11-24, from the default branch of each repo):
#   built          code for the link is on the repo's main branch
#   served_only    one side serves it; no caller was found on the other side
#   switched_off   built, and off by config in every environment
#   contract_only  written in the boundary doc; no code on either side
#   decided        an owner decision exists; not built
#   proposed       written down, awaiting the owner
# None of these says the link is running on staging. "Built" is code on main.
#
# Commits read: OCR-docs 70c8a0b, ourSharedEvents 9537680, ourWKRP 08841f4,
# ourEventRings ea20fa1, ourCommunityRituals f6c6c3d.
#
# Edges carry dates so the graph keeps its history: `since` is when the link
# was first written down or built, the earliest date found in the sources named
# in `evidence` (some repo histories were re-imported, so a git date can be later
# than the real start); `retired` (absent while the link stands) closes it. An edge is never deleted, only retired, and its id is never reused.
# ============================================================================

schema_version: 1.0.0
last_verified: 2026-11-24

# The nodes. `product_id` matches product-registry.yaml where the product is
# registered. ourEventRings and the hub are not product records there, so they
# carry their own ids here.
nodes:
  - id: ocr-docs
    repo: ourCommunityRituals/OCR-docs
    side: governance
  - id: hub
    repo: ourCommunityRituals/ourCommunityRituals
    side: shared_code
  - id: ose
    repo: ourCommunityRituals/ourSharedEvents
    side: anonymous
  - id: osm
    repo: ourCommunityRituals/ourSharedMagnets
    side: anonymous
  - id: wkrp
    repo: ourCommunityRituals/ourWKRP
    side: named
  - id: oaw
    repo: ourCommunityRituals/ourAirwaves
    side: named
  - id: osg
    repo: ourCommunityRituals/ourSharedGames
    side: pre_tech
  - id: osp
    repo: ourCommunityRituals/ourSharedPulse
    side: pre_tech
  - id: osr
    repo: ourCommunityRituals/ourSharedRecords
    side: pre_tech
  - id: oer
    repo: ourCommunityRituals/ourEventRings
    side: intelligence

# kind:
#   data        rows or counts cross (the privacy-relevant kind)
#   code        a shared package or pinned commit is consumed
#   governance  rules, standards or checks flow from the brain
# privacy_class (data edges only): A, B or X as defined in the boundary doc
# section 3; "public" for a read of what a public page already shows.
edges:

  # ── Data: products to ourEventRings ────────────────────────────────────────
  - id: E1
    from: ose
    to: oer
    kind: data
    what: >
      Batch export to BigQuery: events_backup (the event index row),
      corridor_density_baseline_export, event_series_export and
      corridor_flow_export. A schema for corridor_returns_export exists; the
      export code says that table receives nothing yet.
    privacy_class: A
    floor: Under-5 floor and corridor (res 7) grain per the boundary doc 4.1, 4.1.1 and 4.1.2
    status: built
    since: 2026-05-15
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.1
    enforced_by:
      - "invariant #17 (oer-emission-boundary.invariant.spec.ts in OSE)"
    evidence: >
      ourSharedEvents workers/oursharedevents/bigquery/*.schema.json (5 files);
      src/lib/shared-report-export.ts, src/lib/corridor-flow-export.ts,
      src/cloud/bigquery.ts. `since` is the OSE-272 SharedReport export work
      (transcripts, May 2026).

  - id: E2
    from: wkrp
    to: oer
    kind: data
    what: Curation signals, community engagement counts and named profile signals.
    privacy_class: B
    floor: Aggregate only at aggregate level; revocation reaches OER within 24 h
    status: contract_only
    since: 2026-08-02
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.2
    enforced_by: []
    evidence: Boundary doc 4.2. No BigQuery export found in ourWKRP src.

  - id: E3
    from: oaw
    to: oer
    kind: data
    what: Deployment registry telemetry (deployment id, corridor, tier, activation date).
    privacy_class: A
    floor: No client data crosses
    status: contract_only
    since: 2026-08-02
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md section 4.3
    enforced_by: []
    evidence: Boundary doc 4.3. ourAirwaves holds documents only.

  - id: E4
    from: osm
    to: oer
    kind: data
    what: As written in the boundary doc for OSM.
    privacy_class: A
    floor: As the boundary doc sets
    status: contract_only
    since: 2026-08-02
    contract: OCR_ARCHITECTURE_oerAggregationBoundary.md (OSM section)
    enforced_by: []
    evidence: Boundary doc scope line lists OSM. ourSharedMagnets holds documents only.

  # ── Data: between ourSharedEvents and ourWKRP (HTTP only) ──────────────────
  - id: E5
    from: wkrp
    to: ose
    kind: data
    direction_note: ourWKRP serves; OSE was meant to call it.
    what: "GET /api/events/:eventId/music on ourWKRP: an event's sets, top tracks and floored counts."
    privacy_class: B
    floor: Floored counts; no listener identity
    status: served_only
    since: 2026-08-02
