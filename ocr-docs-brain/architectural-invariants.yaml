  # ── #25 SPONSOR SHARE COVENANT ───────────────────────────────────────────────
  - id: 25
    name: sponsor_share_covenant
    label: "#25 — Sponsor Share Covenant"
    group: commercial_governance
    group_order: 3
    title: Sponsor Share Covenant
    status: live
    test_file: tests/e2e/0-architecture/sponsor-share-covenant.invariant.spec.ts (OSE repo — planned, OSE-663 / OSE-662)
    enforces: >
      Sponsor rotation on the public-URL surface is a share-of-voice percentage
      computed by the covenant allocation math (OSE-663) — never a purchasable
      position. Size, slot, and logo treatment are uniform for all sponsors
      regardless of spend. Every is_local sponsor receives at least the
      guaranteed local floor share. No pricing tier or individual sponsor's
      share exceeds the premium cap. is_local is geo-derived (corridor-cell
      match), never a purchasable or admin-toggle flag. Demand redistributes the
      remaining shares while the local floor and the premium cap hold at every
      demand level. Money buys frequency-share and report depth only — never
      size, slot, position, or is_local status.
    applies_to:
      - ose
    protective_statement: >
      Invariant #5 (Local Sponsor Covenant) guarantees a local sponsor a PLACE —
      "the local stays in." #25 makes that guarantee QUANTITATIVE on every
      rotation surface: a floored share of voice rather than a locals-first sort
      (the locals-first tierSort is retired). #25 is the covenant made
      computable. On any surface, "the local stays in" is no longer enough — a system could
      keep the local technically present while starving its share of voice to
      near-zero and letting the highest bidder consume the rest of the rotation.
      The Sponsor Share Covenant makes the guarantee quantitative: money buys
      frequency-share and report depth, and nothing else. It cannot buy a bigger
      logo, a better slot, a fixed position, a share above the premium cap, or a
      manual is_local flag; and it cannot push a local below its guaranteed
      floor. Without this invariant the public rotation silently degrades into
      the commodity ad auction that #1-#5 exist to prevent — a national brand
      buys visual dominance, is_local becomes a sales lever, and the
      local-economy flywheel that makes OSE non-substitutable collapses.
    enforcement_statement: >
      LIVE (OSE-661 / OSE-670, 2026-08-08) — enforced against the pure allocation
      math AND the resolver seam, all in CI. (a) PURE-FUNCTION — the covenant
      allocation math (OSE-663) is a pure function allocateShares(sponsors) →
      shares[]; every wall below is asserted against it directly (no I/O), so the
      walls are provable at any demand level —
      workers/oursharedevents/tests/sponsor-share-covenant.spec.ts and
      tests/sponsor-share-rotation.spec.ts (the buildShareRotation seam that both
      the renderer and the admin form consume via sovTierOf). (b) FLOOR PROPERTY
      (born red vs a floor-breach fixture) — the is_local class collectively
      holds >= LOCAL_FLOOR at every demand level. (c) CAP PROPERTY (born red vs a
      cap-breach fixture) — no pricing tier's and no individual sponsor's share
      exceeds PREMIUM_CAP when satisfiable. (d) UNIFORM-RENDER PROPERTY — a
      RotationEntry exposes ONLY frequency (sharePct); no size/slot/position
      field exists, so uniform placement holds by construction, and
      sponsor-resolver.filterSponsorsForSurface returns every active sponsor for
      every surface (the named-slot filter is retired). The admin authoring path
      is walled too: sponsors.ts forces placement_formats to the uniform value on
      create and makes it non-writable on update (tests/sponsor-covenant-authoring.spec.ts).
      (e) GEO-DERIVED is_local PROPERTY (born red vs a buy-is_local fixture) —
      sponsors.ts derives is_local from the sponsor<->event h3_res7 corridor-cell
      match on create AND update, never from the request body. (f)
      REDISTRIBUTION-INVARIANCE — across a demand sweep the floor and cap hold
      while the remainder redistributes. Structural code-shape locked by
      tests/e2e/0-architecture/sponsor-share-covenant.invariant.spec.ts; brain<->OSE
      drift by sponsor-allocation-drift-check.spec.ts. Allocation parameters
      (LOCAL_FLOOR=30, PREMIUM_CAP=40, MID_CAP=20, weights 1/3/7, MIN_PRESENCE=2)
      live in sponsor-allocation.yaml — co-located with the #5 covenant params
      per Invariant #13 brain_enforcement_location. The locals-first tierSort of
      #5 is RETIRED and superseded by this share model on every rotation surface.
    references:
      linear_story_math: "OSE-663 — Sponsor Covenant Allocation Math (pure allocateShares)"
      linear_story_redteam: "OSE-662 — Sponsor-share adversarial set (cap-breach, floor-breach, buy-size/slot, buy-is_local)"
      brain_canonical: "ocr-docs-brain/sponsor-allocation.yaml (share_of_voice block)"
      companion_invariant: >
        #5 tier_equity / Local Sponsor Covenant — #5 guarantees the local a PLACE
        (display-priority, no cap on today's surfaces); #25 makes the covenant
        quantitative and capped for the public-URL rotation (finite-share
        surface). #5 and #25 share the sponsor-allocation.yaml canonical artifact.
        #23 red_team_coverage — #25's born-red property tests are the red-team
        coverage for the sponsor-rotation layer. #13 brain_enforcement_location —
        allocation params co-located in sponsor-allocation.yaml.
      activation_criterion: >
        OSE-663 landed (pure allocation function) AND
        sponsor-share-covenant.invariant.spec.ts landed (property-based, born-red
        per wall, wired to the T0 Gate invariants shard). Promote to partial at
        floor+cap coverage; live at full adversarial set green, each born red
        first.

# ═════════════════════════════════════════════════════════════════════════════
# Enrichment History — append-only record of lean → rich (and other material)
# invariant transitions. Documents the evolution of the registry over time so
# future maintainers can trace WHY each invariant got the depth of
# documentation it has, and HOW the pattern itself evolved.
#
# Pattern rule: when an invariant entry is materially expanded or its status
# changes from planned/partial → live (or vice versa, with rationale), append
# an entry here. NEVER delete past entries. NEVER renumber invariants. The
# history is the contract.
# ═════════════════════════════════════════════════════════════════════════════
enrichment_history:
  - invariant_id: 1
