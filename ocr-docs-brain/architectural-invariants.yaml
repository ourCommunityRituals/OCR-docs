  - id: 13
    name: brain_enforcement_location
    label: "#13 — Brain Enforcement Co-location"
    group: governance_brain
    group_order: 1
    title: Brain Enforcement Co-location
    status: live
    test_file: audit_brain_enforcement_location.py
    enforces: >
      Any script, test, or check whose purpose is to enforce the shape of
      ocr-docs-brain/*.yaml MUST live in ocr-docs-brain/scripts/ or
      ocr-docs-brain/tests/ — never in the workspace root, an application
      repo, or a separate ci-scripts package. Co-locating Brain content with
      Brain enforcement keeps every contract change to one PR, one review, one
      diff. Enforced centrally (not by per-repo *.invariant.spec.ts files) by
      audit_brain_enforcement_location.py — a filename-pattern scan of the
      workspace root and every app repo — wired into brain-location-audit.yml
      nightly and on PRs touching ocr-docs-brain/ or docs/standards/. Live:
      the audit mechanism is code-shape-locked by 5 structural checks in
      level2_schema.py (inv13_*), run on every PR via brain-validate.yml.
    applies_to: []
    exceptions: []
    protective_statement: >
      Protects against architectural invariant enforcement code drifting out
      of the brain into application repos or workspace roots. When enforcement
      code is co-located with the brain artifacts it governs, every contract
      change stays in one PR, one review, one diff — there is no way to silently
      update an invariant without updating its enforcer (and vice versa).
      When enforcement code scatters, a change to the brain schema may not
      update the check that validates it, leaving the invariant enforced only
      on paper. This is the meta-invariant: it protects the integrity of all
      13 other invariants' enforcement mechanisms.
    enforcement_statement: >
      Three-layer enforcement at live status:
      (a) AUDIT SCAN — ocr-docs-brain/scripts/audit_brain_enforcement_location.py
      walks the workspace root and all app repo working trees via
