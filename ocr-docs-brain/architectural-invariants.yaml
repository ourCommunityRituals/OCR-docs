      Three-layer pyramid (L0 + L1 + T3) satisfies the live criterion.

  # ══ GROUP 4: SECURITY & ISOLATION ═══════════════════════════════════════════
  # Cross-cutting security — tenant isolation is the single invariant here.

  # ── #9 TENANT ISOLATION ───────────────────────────────────────────────────
  - id: 9
    name: tenant_isolation
    label: "#9 — Tenant Isolation"
    group: security_isolation
    group_order: 1
    title: Tenant Isolation
    status: partial
    test_file: tenant-isolation.invariant.spec.ts
    enforces: Dual-key pattern (id + brandId) on every multi-tenant table.
      No cross-tenant data leakage in queries. Brand-scoped URLs maintain
      isolation. Schema pattern exists; needs the cross-cutting test.
    applies_to:
      - ose
      - osm
      - oaw
    protective_statement: >
      Protects against cross-tenant data leakage in a multi-brand OSE
      deployment. Every multi-tenant table carries brand_id TEXT NOT NULL.
      The public events list endpoint scopes all results to a single brand.
      A brand_id format validator at the CREATE handler prevents injection
      via the tenant key. Without these gates, a single-query change could
      silently expose one sponsor's event roster to a competitor's audience.
    enforcement_statement: >
      Five-layer enforcement cascade:
      (a) L0 SCHEMA GATE — structural spec asserts brand_id TEXT NOT NULL
      on events (migration 0001), node_hierarchy, and corridors (migration
      0010); composite index on (brand_id, status) confirmed in migration
      0007 (tenant-isolation.invariant.spec.ts, 9 cases, T0 Gate invariants
      shard — added 2026-07-26).
      (b) L0 QUERY GATE — same spec asserts handleListEvents uses WHERE
      brand_id = ? AND status = 'active'; INSERT statement names brand_id
      in the column list; brand_id format is validated before INSERT.
      (c) L0 ADMIN AUTH BOUNDARY — same spec asserts router.ts imports
      requireAdmin from the auth module AND every /admin and /api/v2/admin
      route definition in router.ts has a requireAdmin call within 20 lines
      (proximity check). Closes the HTTP-layer complement to the data-layer
      isolation above: a new admin route added without the auth guard
      silently bypasses auth for the entire admin surface (2 tests, added
      2026-07-26).
      (d) L1 RUNTIME ISOLATION — workers/oursharedevents/tests/
      tenant-isolation.spec.ts (vitest+cloudflare:test, 4 cases, in-process
      miniflare + D1 seeding — added 2026-07-26); seeds brand-alpha and
      brand-beta, asserts public list for each brand contains only that
      brand's events and unknown brand returns empty; all 4 pass. Proves
      WHERE brand_id = ? actually isolates at runtime — a SQL bug like OR
      vs AND, or a missing bind, would pass L0 but fail here.
      (e) T4 RUNTIME (planned) — cross-brand isolation spec against live
      staging worker: requires deployed multi-brand D1 instance.
      Design note: GET /api/v2/events/:id (single-event) fetches by UUID
      only — acceptable at current OSE phase (single-brand deployments,
      unguessable UUIDs). T4 spec should verify response includes brand_id
      so consumers can reject off-brand payloads.
    references:
      adr_table_source: "docs/adr/ADR-009-ncr-v2-geographic-hierarchy.md — introduced node_hierarchy + corridors (migration 0010); #9 isolates those multi-tenant tables per brand_id"
      schema_migrations: >
        workers/oursharedevents/migrations/0001_create_events.sql
        (brand_id TEXT NOT NULL on events);
        workers/oursharedevents/migrations/0007_create_indexes.sql
        (composite index on brand_id, status);
        workers/oursharedevents/migrations/0010_create_ncr_v2_hierarchy.sql
        (brand_id on node_hierarchy and corridors)
      structural_gate: >
        tests/e2e/0-architecture/tenant-isolation.invariant.spec.ts
        (9 cases, T0 Gate invariants shard — 7 data-layer + 2 admin-auth-boundary,
        added 2026-07-26)
      runtime_isolation_gate: >
        workers/oursharedevents/tests/tenant-isolation.spec.ts
        (L1 vitest+cloudflare:test, 4 cases, in-process miniflare + D1 —
        added 2026-07-26; 4/4 pass — proves runtime isolation beyond code shape)
      handler: >
        workers/oursharedevents/src/handlers/events.ts
        (handleListEvents WHERE brand_id = ?; handleCreateEvent INSERT +
        brand_id format validation)
    activation_note: >
      partial→live criterion: T0 structural gate present (done, 2026-07-26);
      L1 miniflare runtime isolation gate present and passing (done,
      2026-07-26 — 4 cases: alpha list contains only alpha events, beta
      list contains only beta events, unknown brand returns empty, all
      returned items carry correct brand_id). Remaining criterion for live:
      T4 staging cross-brand isolation spec against a deployed multi-brand
      worker (requires live staging infrastructure with multi-brand D1
      seeding).

  # ── #15 CORS ALLOWLIST IMMUTABILITY ──────────────────────────────────────────
  - id: 15
    name: cors_allowlist_immutability
    label: "#15 — CORS Allowlist Immutability"
    group: security_isolation
    group_order: 2
    title: CORS Allowlist Immutability
    status: live
    test_file: cors-allowlist.invariant.spec.ts
    enforces: >
      The CORS origin allowlist in src/lib/cors.ts must remain an explicit
      Set of OCR-owned domains (oursharedevents.com and its subdomains).
      No wildcard ('*') origin permitted. corsOrigin must return null for
      non-allowlisted origins. corsHeaders must return empty object for
      blocked origins. ALLOWED_ORIGINS must be a Set (not a boolean, regex,
      or open passthrough). All domains in the allowlist must match the
      oursharedevents.com domain family. Six-case structural spec locked in
      T0 Gate invariants shard.
    applies_to:
      - ose
    protective_statement: >
      A wildcard CORS policy (`Access-Control-Allow-Origin: *`) on the OSE
      Worker would allow any origin — including adversarial scripts on
      arbitrary domains — to make credentialed cross-origin requests to the
      admin API and read/write event data without user interaction. This is
      a one-character change (`'*'` instead of an explicit domain) that
      silently opens the admin surface to every origin on the internet. The
      invariant ensures the allowlist stays explicit, Set-based, and
      OCR-domain-scoped so no future "just allow all origins during
      development" shortcut can persist into a merge.
    enforcement_statement: >
      L0 STRUCTURAL CODE-SHAPE LOCK — tests/e2e/0-architecture/
      cors-allowlist.invariant.spec.ts (6 cases, T0 Gate invariants shard —
      added 2026-07-26) asserts: cors.ts exists at canonical path;
      no wildcard ('*') string literal appears in the file; ALLOWED_ORIGINS
      is declared as a Set and the allowlist is enforced via Set.has();
      corsOrigin exports and returns null on failure; corsHeaders exports
      and returns {} for blocked origins; every domain in ALLOWED_ORIGINS
      is under the oursharedevents.com domain family.
      This is a single-layer enforcement for a single-file, single-function
      concern. The spec is structural (reads via node:fs), runs on every PR +
      push in the T0 invariants shard, and is classified as structural by the
      infra-consistency.test.js placement guard. Runtime coverage is provided
      by the existing CORS integration in the API smoke tests (workers'
      cors.ts is exercised on every authenticated request in T0 gate `tests`
      shard).
    references:
      cors_lib: workers/oursharedevents/src/lib/cors.ts
      structural_gate: >
        tests/e2e/0-architecture/cors-allowlist.invariant.spec.ts
        (6 cases, T0 Gate invariants shard — added 2026-07-26)
      companion_invariant: >
        Invariant #9 tenant_isolation — admin-auth-boundary tests in
        tenant-isolation.invariant.spec.ts are the HTTP-layer complement;
        this invariant is the origin-layer complement
    activation_note: >
      Status LIVE from initial creation (2026-07-26). The structural spec is
      the enforcement mechanism; the invariant flips live the moment the spec
      is wired to T0. Evidence chain: (a) cors-allowlist.invariant.spec.ts
      (6 cases, all pass) wired to T0 invariants shard in
      oursharedevents-ci.yml; (b) infra-consistency.test.js placement guard
      confirms the spec is classified as structural and present in the shard;
      (c) cors.ts is clean — explicit Set allowlist, null return for blocked
      origins, no wildcard.

  # ── #17 OER EMISSION BOUNDARY ────────────────────────────────────────────────
  - id: 17
    name: oer_emission_boundary
    label: "#17 — OER Emission Boundary"
    group: security_isolation
    group_order: 3
    title: OER Emission Boundary
    status: live
    test_file: oer-emission-boundary.invariant.spec.ts
    enforces: >
      The OSE Cloudflare Worker must not bind any D1 database other than `DB`
      (anonymous scan/event surface) and `FORMS_DB` (identified-user forms
      surface). No `[[services]]` or `[[env.*.services]]` Worker-to-Worker
      service binding stanza may appear in wrangler.toml. Cross-product
      communication must go through the public API layer, not Worker RPC or
      direct D1 binding. Three-case structural spec locked in T0 Gate
      invariants shard.
    applies_to:
      - ose
    protective_statement: >
      OurEventRings (OER) is the intelligence and analytics layer — products
      emit events, OER ingests and answers. The architecture explicitly
      prohibits products from querying each other's databases directly. The
      Cloudflare Worker runtime enforces this at the binding layer: a D1
      database is only accessible inside a Worker if it is declared as a
      binding in wrangler.toml. The attack vector is a developer adding a
      cross-product D1 binding to wrangler.toml — for example, binding OW's
      named-identity database from the OSE anonymous-identity surface. OSE is
      anonymous-by-construction; OW is named-by-design. A cross-binding would
      allow the OSE Worker to join anonymous scan records against OW's named
      user table, silently destroying the privacy guarantee that is the
      product's core founding commitment. The same risk applies to Worker
      service bindings (`[[services]]`): a service-bound Worker gains a direct
      RPC channel and can proxy raw D1 rows to the caller, bypassing both the
      public API contract and the privacy isolation layer. The invariant ensures
      the wrangler.toml binding list stays narrow and explicit so no accidental
      or incremental coupling can accumulate undetected across refactoring
      sessions.
    enforcement_statement: >
      L0 STRUCTURAL CONFIG-SHAPE LOCK — tests/e2e/0-architecture/
      oer-emission-boundary.invariant.spec.ts (3 cases, T0 Gate invariants
      shard — added 2026-07-27) asserts:
      (a) wrangler.toml exists at the canonical path
      (workers/oursharedevents/wrangler.toml).
      (b) Every d1_databases binding name in the file (in any environment
      section — base, staging, production) is exactly `DB` or `FORMS_DB`.
      The parser walks the TOML line-by-line, identifies every
      [[d1_databases]] or [[env.*.d1_databases]] stanza, and extracts the
      `binding = "..."` value. Any name outside the permitted set fails CI.
      To add a new OSE-internal D1 database legitimately, add its binding
      name to PERMITTED_D1_BINDINGS in the spec AND add a brain
      enrichment_history entry in the same PR.
      (c) No [[services]] or [[env.*.services]] stanza appears in
      wrangler.toml. Service bindings open a Worker-to-Worker RPC channel
      that could proxy cross-product DB access. If a service binding is
      genuinely needed (e.g., an internal sidecar), this assertion must be
      replaced with an explicit allowlist and a brain enrichment_history
      entry documenting the decision.
    references:
      wrangler_config: workers/oursharedevents/wrangler.toml
      structural_gate: >
        tests/e2e/0-architecture/oer-emission-boundary.invariant.spec.ts
        (3 cases, T0 Gate invariants shard — added 2026-07-27)
      boundary_specification_doc: >
        docs/architecture/OCR_ARCHITECTURE_oerAggregationBoundary.md
        (OCR-ENF-24 — ratified 2026-08-02; defines full emission contract
        per product, privacy classification gate, prohibition matrix,
        governance protocol for new emission fields, and OER ingestion model)
      companion_invariant: >
        Invariant #9 tenant_isolation — intra-product multi-brand isolation;
        #17 is the inter-product isolation complement.
        Invariant #1 anonymous_id — the privacy contract that cross-product
        DB coupling would destroy.
        Invariant #22 cross_repo_import_isolation — module-level boundary
        complement to #17's binding-level boundary.
    activation_note: >
      Status LIVE from initial creation (2026-07-27). The structural spec is
      the enforcement mechanism; the invariant flips live the moment the spec
      is wired to T0. Evidence chain: (a) oer-emission-boundary.invariant.spec.ts
      (3 cases) wired to T0 invariants shard in oursharedevents-ci.yml;
      (b) wrangler.toml is clean — DB and FORMS_DB only, no services stanza;
      (c) PERMITTED_D1_BINDINGS = ['DB', 'FORMS_DB'] is the explicit escape
      hatch: any future legitimate OSE-internal DB is added to the spec list
      + brain enrichment_history in the same PR diff, making the decision
      visible and reviewable.

  # ══ GROUP 5: INFRASTRUCTURE & CI ════════════════════════════════════════════
  # Deployment layer — makes CI reliable and keeps one-way decisions one-way.

  # ── #10 DEPRECATION LOCK ──────────────────────────────────────────────────
  - id: 10
    name: deprecation_lock
    label: "#10 — Deprecation Lock"
    group: infrastructure_ci
    group_order: 1
    title: Deprecation Lock
    status: live
    test_file: deprecation-lock.invariant.spec.ts
    enforces: Once a runtime is removed from the substrate (today's canonical
      instance — Google Apps Script; future inheritors — Sheets, embedded
      HTML when Phase 3 Firebase lands), CI MUST forbid its re-introduction.
      The lock generalizes the existing scripts/guard-no-gas.js + CI wiring
      so each future deprecation inherits the same pattern (one scanner +
      one allowlist + one CI step + one structural test).
    applies_to:
      - ose
      - osm
      - wkrp
      - oaw
    protective_statement: >
      Without an automated lock, a future "small change" can silently
      bring back the deprecated dependency — usually because someone
      copied a snippet from old docs or imported a package that pulls it
      in transitively. The entire migration to remove it becomes useless
      overnight. The deprecation lock is the mechanism that makes a
      one-way architectural decision actually one-way: once OSE moved off
      Google Apps Script to Cloudflare Workers + D1, the brain promises
      attendees a worker-only backend; a re-introduction violates that
      promise. The pattern generalizes — when Phase 3 Firebase lands and
      embedded HTML is deprecated, the same scaffolding catches its
      re-entry; when GAS becomes Sheets, when Sheets becomes BigQuery,
      each transition inherits the same lock shape.
    enforcement_statement: >
      Four-layer enforcement, all on the substrate side, all wired into
      CI on every PR + push-to-main:
      (a) Scanner — scripts/guard-no-gas.js scans the repo for any
      forbidden GAS pattern (script.google.com, GAS_BASE_URL, doGet,
      ContentService, SpreadsheetApp, PropertiesService, clasp,
      action=api_, google.script.run, ScriptApp, UrlFetchApp). Exits
      non-zero on any hit not in the allowlist.
      (b) Allowlist — scripts/guard-no-gas.allowlist.json carries
      explicit per-file allowed tokens for legitimate references
      (clasp config, vendored adapter shims, archive directories,
      historical security audit reports). Fail-closed — no allowlist
      file means no exceptions.
      (c) Self-tests — scripts/guard-no-gas.test.js verifies the
      scanner's behavior (detection across all pattern classes, clean
      directories pass, allowlist works for both specific-token and
      wildcard forms, excluded directories like node_modules ignored,
      fail-closed on missing allowlist). 17 cases minimum.
      (d) CI wiring — .github/workflows/oursharedevents-ci.yml lint
      shard invokes `npm run test:guard-no-gas` (self-tests) BEFORE
      `npm run guard:no-gas` (the scan itself). The self-tests-first
      ordering exists because of the OSE PR #249 discovery — the
      scanner had a Windows-only path-normalization bug that silently
      neutralized the allowlist for 2+ years; the self-tests caught it
      the moment they were wired into CI. The structural invariant test
      tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts locks
      this entire layer cake — every mechanism file must exist, the
      package.json script must be registered, and the CI workflow must
      actually invoke the guard. A guard that lives in scripts/ but is
      never invoked by CI is theater; this invariant prevents that
      failure mode.
    references:
      scanner: scripts/guard-no-gas.js
      allowlist: scripts/guard-no-gas.allowlist.json
      self_tests: scripts/guard-no-gas.test.js
      runbook: docs/security/NO_GAS_GUARD.md
      ci_workflow: .github/workflows/oursharedevents-ci.yml
      structural_test: tests/e2e/0-architecture/deprecation-lock.invariant.spec.ts
      activation_pr: "OSE#249 — substrate test + CI wiring + Windows-path bug fix (lint shard CI green 2026-05-18)"
      template_pattern: "invariant #1 anonymous_id (rich-form template)"
    activation_note: >
      Status PARTIAL → LIVE on 2026-05-18 with OSE PR #249. Evidence:
      OurSharedEvents CI/CD T0 Gate (lint) shard ran green on main with
      both `npm run test:guard-no-gas` and `npm run guard:no-gas` steps
      invoked — proves the four enforcement layers are all wired and
      mutually-load-bearing. Future deprecations (Sheets removal,
      embedded HTML removal when Phase 3 Firebase lands) inherit this
      pattern: one scanner + one allowlist + one CI step + one
      structural invariant test.

  # ── #11 SELF-HOSTED RUNNER BASH RESOLUTION ────────────────────────────────
  - id: 11
    name: self_hosted_runner_bash_resolution
    label: "#11 — Self-Hosted Runner Bash Resolution"
    group: infrastructure_ci
    group_order: 2
    title: Self-Hosted Runner Bash Resolution
    status: retired
    # test_file is the HISTORIC name — the spec was deleted from OSE in the paired
    # OSE-1194 PR. Kept so conformance reports and the enrichment_history below
    # stay resolvable. check_brain_contract.py skips retired entries.
    test_file: runner-environment.invariant.spec.ts
    retirement_note: >
      RETIRED 2026-09-02 (OSE-1194). The self-hosted runner fleet (BLOODRAVEN,
      BLOODRAVEN-2, BLOODRAVEN-3 — Windows) was decommissioned; every OCR
      workflow runs on GitHub-hosted ubuntu-latest, where bash resolution is
      owned by the runner image and the WSL-vs-Git-Bash trap cannot occur.
      Every mechanism listed under enforces/enforcement_statement/references
      (tools/runner/*.ps1, runner-env-validation.yml, the structural spec)
      was deleted from OSE. The text below is preserved verbatim as the
      historical contract; nothing in it is enforced or to be re-created.
    # SUBSTRATE invariant. Protects every product's CI (see applies_to), but the
    # runner tooling + its structural test live once at the shared substrate:
    # OSE owns tools/runner/* and tests/e2e/0-architecture/*. Per the OCR-41
    # ownership axis, the artifact is validated in the owner (ose) and NOT
    # demanded inside every spoke repo.
    lives_in: ose
    enforces: 'RETIRED 2026-09-02 (OSE-1194) — historical contract, no longer
      enforced (see retirement_note). On Windows self-hosted runners (Bloodraven + any sibling
      instances), `bash` MUST resolve to Git Bash (C:\Program
      Files\Git\usr\bin\bash.exe), NEVER to the WSL/Microsoft Store shim at
      C:\Users\<user>\AppData\Local\Microsoft\WindowsApps\bash.EXE. WSL bash
      interprets backslashes in Windows paths as escape characters,
      corrupting any `shell: bash` workflow step script-file path. Enforced
      by: (a) tools/runner/setup-runner.ps1 — one-shot post-config.cmd
      script that chains provision-runner.ps1 (Git-Bash-first PATH) +
      install-janitor-tasks.ps1 (probe + watchdog) + verify-runner-env.ps1
      (pre-flight confirmation), satisfying both invariant #11 + #12
      partial→live criteria automatically; (b) CI gate
      .github/workflows/runner-env-validation.yml which runs first on every
      PR and fails fast with actionable error message if the assigned runner
      is misconfigured; (c) runbook tools/runner/README.md; (d) structural
      invariant test tests/e2e/0-architecture/runner-environment.invariant.spec.ts
      which locks the code-shape: setup-runner.ps1 must exist and invoke
      provision-runner.ps1; the verifier MUST detect WSL bash via WindowsApps
      path; the workflow MUST run on self-hosted with pull_request +
      push-to-main triggers AND invoke the verifier AND include the deliberate
      shell:bash smoke step.'
    applies_to:
      - ose
      - osm
      - wkrp
      - oaw
    protective_statement: >
      Protects against silent CI corruption on Windows self-hosted runners
      caused by WSL bash (the Microsoft Store shim) being resolved ahead of
      Git Bash in PATH. WSL bash interprets Windows backslash paths as escape
      sequences, silently corrupting `shell: bash` step arguments. The failure
      mode is particularly dangerous because the corrupted step often succeeds
      with exit code 0 while producing wrong output — no red CI run, no error
      message, wrong artifact. This invariant ensures every runner's PATH
      is provisioned with Git Bash first, verified on every PR, and that
      the verification mechanism itself is code-shape-locked by CI.
    enforcement_statement: >
      Four-layer enforcement cascade:
      (a) PROVISIONING — tools/runner/provision-runner.ps1 writes a canonical
      PATH into each runner's .env file putting Git Bash first. Must be run
      manually after config.cmd registration (partial→live criterion).
      (b) CI GATE — .github/workflows/runner-env-validation.yml runs on every
      PR and push-to-main on self-hosted runners; invokes verify-runner-env.ps1
      which detects WSL bash via WindowsApps path substring and fails non-zero
      with an actionable error message. Also includes a deliberate `shell: bash`
      smoke step that would corrupt if WSL bash were active.
      (c) RUNBOOK — tools/runner/README.md documents the provisioning contract
      and the failure signatures an operator should recognise.
      (d) L0 STRUCTURAL GATE — runner-environment.invariant.spec.ts (8 cases,
      T0 Gate invariants shard, updated 2026-07-27 OSE PR #275) code-shape-locks
      all mechanisms: setup-runner.ps1 must exist and invoke provision-runner.ps1;
      verify-runner-env.ps1 must detect WSL bash via WindowsApps path; the
      workflow must have pull_request + push-to-main triggers on self-hosted
      AND invoke the verifier AND include the bash smoke step.
    references:
      setup_runner: tools/runner/setup-runner.ps1 (one-shot post-config.cmd — satisfies partial→live criterion 2026-07-27)
      provisioning_script: tools/runner/provision-runner.ps1
      verifier: tools/runner/verify-runner-env.ps1
      ci_workflow: .github/workflows/runner-env-validation.yml
      runbook: tools/runner/README.md
      structural_gate: >
        tests/e2e/0-architecture/runner-environment.invariant.spec.ts
        (8 cases, T0 Gate invariants shard — updated 2026-07-27 OSE PR #275,
        previously 7 cases added 2026-05-18 OSE PR #249)
    activation_note: >
      Status PARTIAL → LIVE 2026-07-27 with OSE PR #275. Evidence chain:
      (1) tools/runner/setup-runner.ps1 created — one-shot post-config.cmd
      script that chains provision-runner.ps1 (Git-Bash-first PATH) +
      install-janitor-tasks.ps1 (probe + watchdog) + verify-runner-env.ps1
      (pre-flight confirmation). This eliminates the manual provisioning step
      that kept #11 partial: any operator running setup-runner.ps1 after
      config.cmd automatically satisfies both invariant #11 and #12.
      (2) runner-environment.invariant.spec.ts extended (8th case) to assert
      setup-runner.ps1 exists and invokes provision-runner.ps1.
      (3) tools/runner/README.md step 5 updated to direct operators to
      setup-runner.ps1 instead of the manual provision-runner.ps1 call.
      Prior partial→live criterion (provisioner auto-invoked on config.cmd)
      is satisfied by setup-runner.ps1; it is a documented one-step post-
      registration command rather than a fully automatic hook, which is the
      appropriate level of automation for a self-hosted-runner setup.

  # ── #12 RUNNER POOL READINESS PROBE ───────────────────────────────────────
  - id: 12
    name: runner_pool_readiness_probe
    label: "#12 — Runner Pool Readiness Probe"
    group: infrastructure_ci
    group_order: 3
    title: Runner Pool Readiness Probe
    status: retired
    # test_file is the HISTORIC name — the spec was deleted from OSE in the paired
    # OSE-1194 PR (see #11). check_brain_contract.py skips retired entries.
    test_file: runner-pool-readiness.invariant.spec.ts
    retirement_note: >
      RETIRED 2026-09-02 (OSE-1194), together with #11 (its depends_on). With
      no self-hosted pool there is nothing to keep ready: GitHub-hosted runner
      capacity is managed by GitHub. The janitor probe, watchdog, installer and
      regression suite (tools/runner/) and the structural spec were deleted
      from OSE. The text below is the historical contract only.
    # SUBSTRATE invariant (see #11): runner-pool self-heal lives once at the
    # shared substrate (OSE owns tools/runner/*), validated there — not per
    # spoke. OCR-41 ownership axis.
    lives_in: ose
    enforces: 'RETIRED 2026-09-02 (OSE-1194) — historical contract, no longer
      enforced (see retirement_note). Self-hosted runner pools MUST be self-healing on a 1-minute
      cadence with a 5-minute watchdog. Concrete contract: (a) scheduled
      task "Runner Readiness Probe (1-min)" runs tools/runner/janitor.ps1
      -EnsureReady every 60 seconds — prunes orphan job children, kills
      Workers exceeding per-workflow dwell caps (T0 Gate=10min, S0
      Security=15min, T4 Functional=60min, default=15min), bounces Listeners
      stuck on broker errors (SocketException 995 /
      TaskAgentJobNotFoundException / BrokerServer ERR within last 3 min AND
      no Running-job dispatch in that window). (b) Scheduled task "Runner
      Probe Watchdog (5-min)" runs tools/runner/verify-probe-alive.ps1
      reading actions-runner/_probe-heartbeat.txt — emits RUNNER_PROBE_DEAD
      if the timestamp is stale, covering the case where the probe itself
      stops (PowerShell breaks, task disabled, disk full). (c) Pool-wide
      outage detection: when ALL runners share the same broker-error
      signature within 5 min, SUPPRESS per-runner bounces and emit
      GITHUB_SIDE_OUTAGE — bouncing into a dead upstream broker burns the
      circuit-breaker budget. (d) Circuit breaker: 3 bounces of the same
      runner in 60 min → STOP bouncing, emit RUNNER_POOL_DEGRADED. State
      persists in actions-runner/_janitor-state.json. (e) Queue-idle signal
      MUST be corroboration-gated, not a unilateral bounce trigger — an
      upstream queue (CodeQL on ubuntu-latest, environment-approval blocks,
      workflow_run waiters) is not proof of a local broker problem. A bounce
      requires a recent broker error in THIS Listener''s diag log within 10
      min as corroboration. The unilateral version of this signal caused
      all 3 Bloodraven runners to trip the circuit breaker against healthy
      idle Listeners during PR #159 — see Test-QueueIdleCorroborated
      regression test for the lock-in. (f) Six structured log signals must
      be emitted to actions-runner/_janitor.log: RUNNER_JANITOR (per-runner
      cycle), RUNNER_POOL_READINESS (pool summary), RUNNER_POOL_DEGRADED
      (circuit tripped), GITHUB_SIDE_OUTAGE (upstream broker dead),
      RUNNER_PROBE_ALIVE (watchdog OK), RUNNER_PROBE_DEAD (watchdog alarm).
      Log is auto-rotated at LogMaxMB (default 5 MB). (g) Pure-logic
      regression suite at tools/runner/janitor.tests.ps1 (22 cases minimum)
      MUST pass before any change to the janitor is merged — covers circuit
      breaker state machine, UTC parse safety, per-workflow dwell lookups,
      broker-error parsing, queue-idle corroboration. (h) Structural
      invariant test
      tests/e2e/0-architecture/runner-pool-readiness.invariant.spec.ts
      (added 2026-05-18 via OSE PR #249) locks the code-shape of the
      mechanism: every mechanism file (janitor + install-janitor-tasks +
      janitor.tests + verify-probe-alive) MUST exist; the circuit breaker
      (RUNNER_POOL_DEGRADED), pool-wide outage detection
      (GITHUB_SIDE_OUTAGE), and the probe-heartbeat-watchdog pair MUST
      remain referenced; the runbook MUST document the three
      human-investigate signals. Without the structural test, a future
      refactor could silently drop the circuit breaker (infinite-bounce
      loop) or the outage detection (burns the breaker budget against a
      dead upstream broker) and operators would only notice when the next
      multi-PR outage happens. Installation is via
      tools/runner/install-janitor-tasks.ps1 (no UAC required — LogonType
      Interactive + RunLevel Limited). Status partial — scheduled tasks
      must be installed manually after `config.cmd` registration. Promote
      to live once the installer is auto-invoked from a runner-setup script
      alongside provision-runner.ps1 (the same gap as invariant 11).
      Without this invariant, stuck-runner incidents waste ~60 min of pool
      throughput per occurrence + multiply the agent supervision-token cost
      of every PR loop.'
    applies_to:
      - ose
      - osm
      - wkrp
      - oaw
    depends_on:
      - self_hosted_runner_bash_resolution
    protective_statement: >
      Protects against silent CI pool degradation where a stuck or
      broker-error-looping runner stalls all queued PRs for 60+ minutes
      before an operator notices. Without self-healing, a single stuck
      Runner process blocks the GitHub Actions worker slot indefinitely.
      Without the watchdog, the probe itself can silently die and the
      pool appears healthy while jobs queue forever. Without the circuit
      breaker, automated bounces of a runner against a dead upstream broker
      burn the bounce budget and trigger RUNNER_POOL_DEGRADED for healthy
      runners — the failure mode that caused the Bloodraven PR #159 incident.
      This invariant ensures the pool is self-healing, observability-signaling,
      and operator-actionable — not just retry-until-timeout.
    enforcement_statement: >
      Eight-layer enforcement cascade:
      (a) PROBE — scheduled task "Runner Readiness Probe (1-min)" runs
      janitor.ps1 -EnsureReady every 60s: prunes orphan children, kills
      Workers over dwell cap, bounces broker-error Listeners with corroboration.
      (b) WATCHDOG — scheduled task "Runner Probe Watchdog (5-min)" runs
      verify-probe-alive.ps1 reading _probe-heartbeat.txt; emits
      RUNNER_PROBE_DEAD if stale. Covers the probe silently dying.
      (c) OUTAGE DETECTION — when ALL runners share the same broker-error
      signature within 5 min, suppress per-runner bounces and emit
      GITHUB_SIDE_OUTAGE instead — prevents burning the circuit-breaker
      budget against a dead upstream.
      (d) CIRCUIT BREAKER — 3 bounces of the same runner in 60 min → stop
      bouncing, emit RUNNER_POOL_DEGRADED. State in _janitor-state.json.
      (e) CORROBORATION-GATED QUEUE-IDLE — idle-queue signal requires a
      recent broker error in this Listener's diag log (10 min window);
      unilateral queue-idle bounce caused the PR #159 triple-circuit-breaker
      incident; Test-QueueIdleCorroborated regression test locks this in.
      (f) LOG SIGNALS — 6 structured log signals to _janitor.log; auto-rotated
      at LogMaxMB; signals are the operator's actionability surface.
      (g) REGRESSION SUITE — janitor.tests.ps1 (22 cases min); circuit breaker
      state machine, UTC parse safety, dwell lookups, broker-error parsing,
      queue-idle corroboration; must pass before any janitor change is merged.
      (h) L0 STRUCTURAL GATE — runner-pool-readiness.invariant.spec.ts (9
      cases, T0 Gate invariants shard, updated 2026-07-27 OSE PR #275)
      code-shape-locks: all mechanism files exist; setup-runner.ps1 must invoke
      install-janitor-tasks.ps1; circuit breaker + outage detection + probe
      heartbeat remain referenced; runbook documents the three human-investigate
      signals (RUNNER_POOL_DEGRADED, GITHUB_SIDE_OUTAGE, RUNNER_PROBE_DEAD).
    references:
      setup_runner: tools/runner/setup-runner.ps1 (one-shot post-config.cmd — satisfies partial→live criterion 2026-07-27)
      janitor: tools/runner/janitor.ps1
      installer: tools/runner/install-janitor-tasks.ps1
      regression_suite: tools/runner/janitor.tests.ps1
      watchdog: tools/runner/verify-probe-alive.ps1
      runbook: tools/runner/README.md
      structural_gate: >
        tests/e2e/0-architecture/runner-pool-readiness.invariant.spec.ts
        (9 cases, T0 Gate invariants shard — updated 2026-07-27 OSE PR #275,
        previously 8 cases added 2026-05-18 OSE PR #249)
      incident_reference: >
        PR #159 Bloodraven triple-circuit-breaker — unilateral queue-idle
        bounce caused all 3 runners to trip; corroboration gate prevents recurrence
    activation_note: >
      Status PARTIAL → LIVE 2026-07-27 with OSE PR #275. Evidence chain:
      (1) tools/runner/setup-runner.ps1 created — one-shot post-config.cmd
      script that chains provision-runner.ps1 + install-janitor-tasks.ps1 +
      verify-runner-env.ps1. The probe + watchdog tasks (install-janitor-tasks.ps1)
      are automatically installed as part of runner registration, not as a
      separate manual step. This satisfies the partial→live criterion for #12.
      (2) runner-pool-readiness.invariant.spec.ts extended (9th case) to assert
      setup-runner.ps1 invokes install-janitor-tasks.ps1 — locks the co-
      installation requirement so a future refactor of setup-runner.ps1 cannot
      silently drop the probe installation.
      Flips to live in the same OSE PR #275 as invariant #11 (the two criteria
      were the same gap — manual provisioning steps — and setup-runner.ps1
      closes both simultaneously).

  # ── #19 MIGRATION MONOTONICITY ───────────────────────────────────────────────
  - id: 19
    name: migration_monotonicity
    label: "#19 — Migration Monotonicity"
    group: infrastructure_ci
    group_order: 4
    title: Migration Monotonicity
    status: live
    test_file: migration-monotonicity.invariant.spec.ts
    enforces: >
      All D1 migration files must follow the NNNN_*.sql naming convention.
      Migration prefix numbers must be unique (no duplicates) and strictly
      increasing (monotonic). No migration may DROP a load-bearing table
      (events, sponsors, campaigns, scan_aggregates, anon_id_returns,
      poster_deployments, corridors, event_series). Four-case structural
      spec locked in T0 Gate invariants shard.
    applies_to:
      - ose
    protective_statement: >
      Duplicate or non-monotonic migration numbers cause non-deterministic
      apply order in `wrangler d1 migrations apply`: a duplicate prefix means
      two files sort to the same position (one is silently skipped or applied
      twice depending on wrangler version); a lower-numbered file added after a
      higher-numbered one is never applied on databases that have already passed
      that number. Either failure corrupts schema state for any environment that
      has already applied past the gap — including production. A DROP TABLE on
      a load-bearing table would wipe all production data for that entity with
      no schema-level protection. The invariant catches both failure classes at
      PR time (structural read of the migrations/ directory), before wrangler
      ever sees the file.
    enforcement_statement: >
      L0 STRUCTURAL CODE-SHAPE LOCK — tests/e2e/0-architecture/
      migration-monotonicity.invariant.spec.ts (4 cases, T0 Gate invariants
      shard — added 2026-07-26) asserts:
      (a) Every .sql file in migrations/ matches NNNN_*.sql (4-digit zero-padded
      prefix) — wrangler's canonical naming convention.
      (b) No two migration files share the same prefix number — prevents
      non-deterministic apply order across environments.
      (c) Prefix numbers are strictly increasing when files are sorted
      alphabetically — ensures intended apply order matches file sort.
      (d) No migration contains DROP TABLE on a load-bearing table (events,
      sponsors, campaigns, scan_aggregates, anon_id_returns, poster_deployments,
      corridors, event_series) — prevents accidental data wipe via migration.
      To intentionally drop a load-bearing table: remove it from LOAD_BEARING_TABLES
      in the spec AND add a brain enrichment_history entry in the same PR diff,
      making the architectural decision visible and reviewable.
    references:
      migrations_dir: workers/oursharedevents/migrations/
      structural_gate: >
        tests/e2e/0-architecture/migration-monotonicity.invariant.spec.ts
        (4 cases, T0 Gate invariants shard — added 2026-07-26)
      companion_invariant: >
        Invariant #10 deprecation_lock — migration monotonicity is the
        database-schema complement to the code-runtime deprecation lock;
        both enforce that one-way architectural decisions stay one-way.
    activation_note: >
      Status LIVE from initial creation (2026-07-26). The structural spec is
      the enforcement mechanism; the invariant is live the moment the spec
      is wired to T0. Evidence chain: (a) migration-monotonicity.invariant.spec.ts
