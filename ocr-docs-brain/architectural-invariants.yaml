  # ── #3 UNIVERSAL EVENT CODE (UEC) ─────────────────────────────────────────
  - id: 3
    name: uec_encoding
    label: "#3 — Universal Event Code Standard"
    group: product_experience
    group_order: 2
    title: Universal Event Code Standard
    status: live
    test_file: uec-codes.invariant.spec.ts
    enforces: 11 color-semantic QR codes (7 core + 4 extensions). Dual
      palette per code (scan_hex contrast-validated; display_hex brand-warm).
      Canonical hex values sourced from brain artifact at build time. URL
      path semantics. WCAG AA minimum on every scan_hex (AAA where declared).
    applies_to:
      - ose
      - osm
    protective_statement: >
      The choice architecture's visual layer depends on every
      OCR-affiliated event presenting the same color-coded scan surfaces
      with the same semantic meanings. Drift breaks the attendee's mental
      model — they learn "blue means sponsor" at one event and that meaning
      must hold at every event forever. Without this invariant, every
      sponsor placement, every check-in scan, every poster QR loses the
      pre-attentive scannability that makes the platform feel cohesive.
      The dual-palette design (scan_hex for QR module fill;
      display_hex for UI/marketing showcase) recognizes that QR
      scannability and brand-warm display are two distinct functional jobs
      that need two values; collapsing them risks reintroducing the v1.0
      contrast bugs the v1.1 transition specifically fixed.
    enforcement_statement: >
      Brain holds the canonical artifact (ocr-docs-brain/uec-codes.yaml)
      validated by ocr-docs-brain/uec-codes.schema.json. Substrate (OSE)
      consumes the artifact at build time (OSE-320) — never hardcodes UEC
      values in code. Substrate static gate (OSE-322) prevents UEC hex
      literals from appearing anywhere in src/ outside the brain-consumer
      module. Drift check (OSE-323) compares OSE's local UEC values
      against the brain artifact and fails CI on divergence. Brain-side
      schema CI gate (OSE-324) validates artifact structure on every
      change AND computes WCAG contrast for every scan_hex against white,
      asserting the computed grade meets the declared wcag_grade (AA = 4.5:1,
      AAA = 7:1). Together: brain = source of truth; schema = brand-promise
      validator; substrate gates = no-drift enforcement.
    references:
      brain_artifact: ocr-docs-brain/uec-codes.yaml
      brain_schema: ocr-docs-brain/uec-codes.schema.json
      brain_pr: "OCR-docs#49 (OSE-318 — canonical artifact + schema landed 2026-05-17)"
      substrate_consumer_story: OSE-320
      substrate_static_gate_story: OSE-322
      substrate_drift_check_story: OSE-323
      brain_schema_ci_gate_story: OSE-324
      sdet_fixtures_story: OSE-325
      template_pattern: "invariant #1 anonymous_id (template for rich-form invariant entries)"

  # ── #4 NCR DATA ACCUMULATION ──────────────────────────────────────────────
  - id: 4
    name: ncr_data_accumulation
    label: "#4 — NCR Data Accumulation"
    group: product_experience
    group_order: 3
    title: NCR Data Accumulation
    status: live
    test_file: ncr-accumulation.invariant.spec.ts
    enforces: >
      poster_deployments stores lat/lng + placement label per poster.
      scan_aggregates pipeline accumulates unique_agents + scan_count
      per (event_id, h3_res9) bucket from raw scans. Data is permanent —
      no PII means no TTL obligation. NCR (Node, Corridor, Ring) is the
      intelligence layer: scan_aggregates rows are the atomic unit of
      the SharedReport data pipeline (used by corridor_density,
      corridor_map, return_rate, headcount_trend). Aggregation happens
      at write time (cron materialization) not at read time.
    applies_to:
      - ose
      - oureventring
    protective_statement: >
      NCR data is the platform's long-horizon intelligence. Scan counts
      are permanently retained because they contain no PII — the
      anonymous ID never appears in scan_aggregates, only in the
      anon_id_returns intermediary. If someone adds a PII-bearing column
      to scan_aggregates (e.g., a raw anon_id_hash stored per row rather
      than per aggregate bucket), the no-TTL promise becomes a liability:
      unbounded retention of pseudonymous data under GDPR is an exposure.
      The invariant protects both sides: permanent retention requires
      zero PII in the accumulation schema; any PII addition must trigger
      a retention policy and a brain invariant update.
    enforcement_statement: >
      Enforced at live status by three layers — note (a) is runtime and runs
      T4-only (it SKIPS on PRs), so (c) is the on-every-PR structural gate:
      (a) L1 INTEGRATION TEST SUITE — tests/e2e/0-architecture/
      ncr-accumulation.invariant.spec.ts (runtime: uses page fixture
      against deployed worker) asserts: poster_deployments endpoint
      accepts lat/lng + label, scan_aggregates pipeline accumulates
      counts correctly, no PII columns in the accumulation tables,
      H3 cell resolution is correct. Runs in T4 Functional
      (dispatch-only, requires deployed worker).
      (b) SCHEMA LOCK — scan_aggregates and poster_deployments migrations
      define the accumulation schema. The PII column gate in
      tests/workers/oursharedevents/tests/pii-invariant.spec.ts asserts
      no PII column names appear in these tables' column lists. Any
      migration adding a raw identity column would fail that gate.
      (c) L0 STRUCTURAL CODE-SHAPE LOCK — tests/e2e/0-architecture/
      ncr-accumulation.structural.invariant.spec.ts (9 cases, T0 Gate
      invariants shard, added OSE-1298) asserts the accumulation pipeline's
      load-bearing shape via readFileSync with NO deployed worker, so unlike
      (a) it runs on EVERY PR + push: poster lat/lng; hour-bucketed scans (the
      ':00' floor — no exact-time column); scan_aggregates written by EXACTLY
      one file (write-site locality property = "scheduled worker only");
      scheduled() wiring of the materialization run; no-TTL permanence;
      impression surface + placement. Classified structural + wired into the T0
      shard is asserted by the infra-consistency placement guard. Born-red
      verified. This closes the gap where (a) — the only behavioral
      enforcement — never ran on a PR.
    references:
      invariant_test: tests/e2e/0-architecture/ncr-accumulation.invariant.spec.ts
      structural_gate: tests/e2e/0-architecture/ncr-accumulation.structural.invariant.spec.ts
      adr: docs/adr/ADR-009-ncr-v2-geographic-hierarchy.md
      pii_gate: workers/oursharedevents/tests/pii-invariant.spec.ts
      companion_invariant: "Invariant #7 aggregate_only_reporting — SharedReport reads from scan_aggregates"
      companion_invariant_8: "Invariant #8 bounded_pii_retention — TTL applies to FORMS_DB only; NCR has no TTL by design"

  # ── #18 QR CODE URL / SLUG PERMANENCE ────────────────────────────────────
  - id: 18
    name: slug_permanence
    label: "#18 — QR Code URL / Slug Permanence"
    group: product_experience
    group_order: 5
    title: QR Code URL / Slug Permanence
    status: live
    test_file: slug-permanence.invariant.spec.ts
    enforces: >
      Every event slug is encoded in a physical poster QR code URL and must
      be write-once. No migration may perform a structural mutation of the
      slug column (ALTER TABLE events ... slug). The UPDATE event handler's
      allowedFields must not include slug. No raw UPDATE events SET ... slug
      literal may appear in any handler. A UNIQUE constraint or index on slug
      must exist to prevent ambiguous QR destinations. The CREATE handler must
      include slug in the INSERT column list (write at creation only).
    applies_to:
      - ose
    protective_statement: >
      QR codes printed on physical posters are permanent — the URL they encode
      cannot be changed without silently breaking every scanned or memorised
      link. An event slug that changes post-deployment causes: live poster URLs
      to return 404 on the next event lookup; check-in scans at the door to
      fail silently (attendees can't check in); ShortCodes linked to the old
      slug to break; and the NCR scan pipeline to lose its accumulation anchor.
      The slug is the physical-to-digital bridge that makes the Ring flywheel
      work. Without this invariant, a single admin update could sever every
      deployed poster from its event permanently.
    enforcement_statement: >
      L0 STRUCTURAL CODE-SHAPE LOCK — tests/e2e/0-architecture/
      slug-permanence.invariant.spec.ts (5 cases, T0 Gate invariants shard —
      added 2026-07-26) asserts:
      (a) No migration performs a structural mutation of the slug column via
      ALTER TABLE events — covers ADD (re-definition), RENAME, DROP slug.
      (b) The allowedFields object in handleUpdateEvent does not include slug
      — the API-layer write gate that prevents mutation via PATCH.
      (c) No handler file contains a raw UPDATE events SET ... slug literal —
      catches any direct SQL mutation that bypasses the allowedFields pattern.
      (d) The INSERT in handleCreateEvent includes slug in the column list —
      confirms write happens at creation (the only sanctioned write).
      (e) A UNIQUE constraint or index on slug exists in migrations — prevents
      two events sharing a slug, which would make QR destination ambiguous.
      Runtime coverage: the 409 SLUG_TAKEN error response tested in
      testid-pyramid.spec.ts confirms the uniqueness constraint fires at
      the API layer.
    references:
      events_migration: >
        workers/oursharedevents/migrations/0001_create_events.sql
        (slug TEXT NOT NULL UNIQUE — inline column constraint)
      handler: >
        workers/oursharedevents/src/handlers/events.ts
        (handleCreateEvent INSERT includes slug; handleUpdateEvent
        allowedFields excludes slug; SLUG_TAKEN 409 on duplicate)
      structural_gate: >
        tests/e2e/0-architecture/slug-permanence.invariant.spec.ts
        (5 cases, T0 Gate invariants shard — added 2026-07-26)
      ncr_anchor: >
        Invariant #4 ncr_data_accumulation — poster_deployments + scan_aggregates
        pipeline is anchored to the event slug; slug mutation severs the NCR ring
    activation_note: >
      Status LIVE from initial creation (2026-07-26). The structural spec is the
      enforcement mechanism; the invariant is live the moment the spec is wired
      to T0. Evidence chain: (a) slug-permanence.invariant.spec.ts (5 cases,
      all pass) wired to T0 invariants shard; (b) infra-consistency placement
      guard confirms the spec is classified as structural and present in the
      shard; (c) migration 0001_create_events.sql has slug TEXT NOT NULL UNIQUE
      (inline constraint) — no ALTER TABLE slug in any of the 38 migrations;
      (d) handleUpdateEvent.allowedFields does not include slug;
      (e) SLUG_TAKEN (409) error response confirms uniqueness is enforced
      at the application layer.

  # ── #16 API RESPONSE SCHEMA STABILITY ────────────────────────────────────
  - id: 16
    name: api_response_schema_stability
    label: "#16 — API Response Schema Stability"
    group: product_experience
    group_order: 6
    title: API Response Schema Stability
    status: live
    test_file: api-response-schema.invariant.spec.ts
    enforces: >
      Public API endpoints (GET /api/v2/events, GET /api/v2/events/:id) must
      project a minimum set of columns defined in
      src/api-schema-snapshots/public-events.snapshot.json. Removing any field
      from the SELECT MUST bump snapshot.version and remove the field from the
      snapshot — making the break visible in a PR diff. Envelope keys (items,
      item) must remain stable. enrichWithPhase must be called on both list
      and detail results so the computed phase field is always present.
      Seven-case structural spec locked in T0 Gate invariants shard.
    applies_to:
      - ose
    protective_statement: >
      The public API is consumed by mobile clients, the five MVP surfaces,
      and external integrations. A column removed from the SELECT without a
      conscious schema version bump causes silent breakage: the consumer
      receives a 200 with a response that is structurally valid JSON but
      missing a field it renders — no error, no alert, just broken UI.
      Mobile Workability (Invariant #14) guarantees the layout works at
      375×812; API Response Schema Stability guarantees the data that
      populates that layout is actually present. Both must hold
      simultaneously: a perfect mobile layout fed empty data is still a
      broken user experience.
    enforcement_statement: >
      L0 STRUCTURAL CODE-SHAPE LOCK — tests/e2e/0-architecture/
      api-response-schema.invariant.spec.ts (7 cases, T0 Gate invariants
      shard — added 2026-07-26) asserts:
      (a) Snapshot file exists at canonical path (workers/oursharedevents/
      src/api-schema-snapshots/public-events.snapshot.json).
      (b) Snapshot has a version field (enables explicit version bumps on
      breaking changes).
      (c) Every projected_column in the snapshot appears in the
      handleListEvents SELECT (public list endpoint).
      (d) Every projected_column in the snapshot appears in the
      handleGetEvent SELECT (public detail endpoint).
      (e) handleListEvents returns the items envelope key.
      (f) handleGetEvent returns the item envelope key.
      (g) enrichWithPhase is called on both list and detail results (ensures
      the computed phase field is present on every response row).
      The snapshot is a minimum contract (floor, not ceiling): additive
      changes to the SELECT pass without a snapshot update; removals fail
      CI until the snapshot is explicitly updated and the version is bumped.
    references:
      snapshot: workers/oursharedevents/src/api-schema-snapshots/public-events.snapshot.json
      adr: docs/adr/ADR-016-api-v2-response-contract.md
      handler: workers/oursharedevents/src/handlers/events.ts
      structural_gate: >
        tests/e2e/0-architecture/api-response-schema.invariant.spec.ts
        (7 cases, T0 Gate invariants shard — added 2026-07-26)
      companion_invariant: >
        Invariant #14 mobile_workability — layout guarantees; #16 guarantees
        the data the layout renders. Invariant #18 slug_permanence — QR URL
        stability; #16 guards the API payload the QR destination serves.
    activation_note: >
      Status LIVE from initial creation (2026-07-26). The structural spec +
      snapshot file are the enforcement mechanism. Evidence chain:
      (a) api-response-schema.invariant.spec.ts (7 cases, all pass) wired to
      T0 invariants shard; (b) infra-consistency placement guard confirms
      structural classification and shard presence; (c) snapshot version 1.0.0
      committed with all 22 currently-projected columns for both public
      endpoints.

