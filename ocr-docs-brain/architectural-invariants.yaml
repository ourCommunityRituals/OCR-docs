  - invariant_id: 17
    invariant_name: oer_emission_boundary
    from_state: does not exist
    to_state: >-
      rich live (2026-07-27 — new invariant; 3-case structural spec
      oer-emission-boundary.invariant.spec.ts wired to T0 Gate invariants
      shard; locks wrangler.toml d1_databases binding allowlist [DB, FORMS_DB]
      and asserts no [[services]] Worker-to-Worker RPC stanza)
    date: "2026-07-27"
    pr_refs: []
    rationale: >
      CCR loop (2026-07-27) identified a gap in the security_isolation group:
      the OER Emission Boundary architectural principle ("products emit, OER
      ingests, no direct cross-product DB queries") had zero automated
      enforcement. The Cloudflare Worker runtime enforces cross-product DB
      isolation at the binding layer — a D1 database is only accessible if
      declared in wrangler.toml — but nothing prevented a developer from
      adding a cross-product binding to wrangler.toml. The attack vector: bind
      OW's named-identity database from the OSE anonymous-identity surface and
      join anonymous scan records against named user rows, silently destroying
      the core privacy guarantee. The structural spec reads wrangler.toml via
      node:fs, walks TOML sections line-by-line to extract all d1_databases
      binding names across all environments, and asserts each name is in the
      permitted set [DB, FORMS_DB]. It also asserts no [[services]] stanza
      exists, since Worker-to-Worker RPC could proxy cross-product DB access
      without a direct binding. The PERMITTED_D1_BINDINGS set is the explicit
      escape hatch: adding a new OSE-internal DB requires updating the set AND
      adding a brain enrichment_history entry in the same PR — making the
      coupling visible in the diff. The invariant complements #9 (intra-product
      tenant isolation) and #1 (anonymous identity) at the inter-product layer.

