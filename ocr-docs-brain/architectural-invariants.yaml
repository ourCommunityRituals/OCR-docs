# Architectural invariants — CI-enforced contracts.
# Every invariant has a dedicated test file. Status reflects CI enforcement state.

schema_version: 1.0.0
description: The ten architectural invariants are the governance-brain-enforced contracts that the CI
  pipeline validates on every commit. Each invariant has a dedicated test file. An invariant marked "live"
  is currently enforced in CI; "partial" means the enforcement mechanism exists but is not yet promoted
  to the 0-architecture suite; "planned" means the test file and mechanism are scheduled but not yet implemented.
enforcement_gate: ose-platform-tests at org level (CI-enforced)
invariants:
- id: 1
  name: anonymous_id
  title: Anonymous ID
  status: live
  test_file: anonymous-id.invariant.spec.ts
  enforces: Zero-PII scan system. Two-database separation (DB / FORMS_DB). ose_anon cookie contract (HttpOnly,
    Secure, SameSite=Lax). No cross-linking.
  applies_to:
  - ose
  - osm
- id: 2
  name: hyperlocal_geo_resolution
  title: Hyperlocal Geo-Resolution
  status: live
  test_file: geo-resolution.invariant.spec.ts
  enforces: sponsor_areas + sponsor_event_types tables. Corridor-level resolution. zip + radius matching.
  applies_to:
  - ose
- id: 3
  name: uec_encoding
  title: UEC Encoding
  status: live
  test_file: uec-codes.invariant.spec.ts
  enforces: 7 color-semantic QR codes + 4 extensions. Canonical hex values. URL path semantics.
  applies_to:
  - ose
  - osm
- id: 4
  name: ncr_data_accumulation
  title: NCR Data Accumulation
  status: live
  test_file: ncr-accumulation.invariant.spec.ts
  enforces: poster_deployments lat/lng. scan_aggregates pipeline. Permanent storage (no PII = no TTL).
  applies_to:
  - ose
  - oureventring
- id: 5
  name: tier_equity
  title: Tier Equity / Pricing Governance
  status: planned
  test_file: tier-equity.invariant.spec.ts
  enforces: Pricing tiers govern display priority within events only — never platform access. Same QR
    system, same form quality, same privacy protection, same real-time counts at every tier. Local stays
    in at all flag levels.
  applies_to:
  - ose
  - osm
  depends_on:
  - tier-gates.yaml
- id: 6
  name: inert_monetization_hooks
  title: Inert Monetization Hooks
  status: partial
  test_file: monetization-inert.invariant.spec.ts
  enforces: 'X-Monetization-Inert: true header on every response. No billing logic executes. Billable
    units are read-only. Existing CI gate checkMonetizationHooksInert + contract test story-f4-monetization-hooks_MOCK.test.js
    already enforce; promote to 0-architecture suite.'
  applies_to:
  - ose
  research_note: This invariant is the reason research data can be collected cleanly before revenue activation.
    Pre-revenue by contract, not by choice.
- id: 7
  name: aggregate_only_reporting
  title: Aggregate-Only Reporting
  status: planned
  test_file: aggregate-only.invariant.spec.ts
  enforces: SharedReport endpoints return aggregates only — never individual records. Closes the privacy
    story on the output side; the Anonymous ID invariant guards the data; this invariant guards the reports.
  applies_to:
  - ose
- id: 8
  name: bounded_pii_retention
  title: Bounded PII Retention
  status: partial
  test_file: pii-retention.invariant.spec.ts
  enforces: All opt-in PII has a finite TTL (expires_at, retention_expires_at). Daily lifecycle cron deletes
    expired registrations (90d), scrubs survey PII, deletes expired email signups (30d). No PII has unbounded
    retention. Cron + TTL columns + PRIVACY.md exist; promote unified test to 0-architecture suite.
  applies_to:
  - ose
- id: 9
  name: tenant_isolation
  title: Tenant Isolation
  status: partial
  test_file: tenant-isolation.invariant.spec.ts
  enforces: Dual-key pattern (id + brandId) on every multi-tenant table. No cross-tenant data leakage
    in queries. Brand-scoped URLs maintain isolation. Schema pattern exists; needs the cross-cutting test.
  applies_to:
  - ose
  - osm
  - oaw
- id: 10
  name: deprecation_lock
  title: Deprecation Lock
  status: partial
  test_file: deprecation-lock.invariant.spec.ts
  enforces: Once a runtime is removed (GAS, Sheets, etc.), CI forbids its re-introduction. Generalizes
    the existing scripts/guard-no-gas.js and the no-GAS CI gate. Future deprecations (e.g., embedded HTML
    when Phase 3 Firebase lands) inherit this pattern.
  applies_to:
  - ose
  - osm
  - wkrp
  - oaw
- id: 11
  name: self_hosted_runner_bash_resolution
  title: Self-Hosted Runner Bash Resolution
  status: partial
  test_file: runner-environment.invariant.spec.ts
  enforces: 'On Windows self-hosted runners (Bloodraven + any sibling instances), `bash` MUST resolve
    to Git Bash (C:\Program Files\Git\usr\bin\bash.exe), NEVER to the WSL/Microsoft Store shim at
    C:\Users\<user>\AppData\Local\Microsoft\WindowsApps\bash.EXE. WSL bash interprets backslashes
    in Windows paths as escape characters, corrupting any `shell: bash` workflow step script-file
    path. Enforced by: (a) provisioning script tools/runner/provision-runner.ps1 which writes a
    canonical PATH into each runner''s .env file (Git Bash first); (b) CI gate
    .github/workflows/runner-env-validation.yml which runs first on every PR and fails fast with
    actionable error message if the assigned runner is misconfigured; (c) runbook
    tools/runner/README.md. Status partial — gate exists, provisioning is procedural rather than
    automatic on `config.cmd` registration. Promote to live once the provisioner is invoked
    automatically from a runner-setup script.'
  applies_to:
  - ose
  - osm
  - wkrp
  - oaw
- id: 12
  name: runner_pool_readiness_probe
  title: Runner Pool Readiness Probe
  status: partial
  test_file: runner-pool-readiness.invariant.spec.ts
  enforces: 'Self-hosted runner pools MUST be self-healing on a 1-minute cadence with a 5-minute
    watchdog. Concrete contract: (a) scheduled task "Runner Readiness Probe (1-min)" runs
    tools/runner/janitor.ps1 -EnsureReady every 60 seconds — prunes orphan job children, kills
    Workers exceeding per-workflow dwell caps (T0 Gate=10min, S0 Security=15min, T4 Functional=60min,
    default=15min), bounces Listeners stuck on broker errors (SocketException 995 /
    TaskAgentJobNotFoundException / BrokerServer ERR within last 3 min AND no Running-job
    dispatch in that window). (b) Scheduled task "Runner Probe Watchdog (5-min)" runs
    tools/runner/verify-probe-alive.ps1 reading actions-runner/_probe-heartbeat.txt — emits
    RUNNER_PROBE_DEAD if the timestamp is stale, covering the case where the probe itself stops
    (PowerShell breaks, task disabled, disk full). (c) Pool-wide outage detection: when ALL
    runners share the same broker-error signature within 5 min, SUPPRESS per-runner bounces and
    emit GITHUB_SIDE_OUTAGE — bouncing into a dead upstream broker burns the circuit-breaker
    budget. (d) Circuit breaker: 3 bounces of the same runner in 60 min → STOP bouncing, emit
    RUNNER_POOL_DEGRADED. State persists in actions-runner/_janitor-state.json. (e) Queue-idle
    signal MUST be corroboration-gated, not a unilateral bounce trigger — an upstream queue
    (CodeQL on ubuntu-latest, environment-approval blocks, workflow_run waiters) is not proof
    of a local broker problem. A bounce requires a recent broker error in THIS Listener''s diag
    log within 10 min as corroboration. The unilateral version of this signal caused all 3
    Bloodraven runners to trip the circuit breaker against healthy idle Listeners during PR #159
    — see Test-QueueIdleCorroborated regression test for the lock-in. (f) Six structured log
    signals must be emitted to actions-runner/_janitor.log: RUNNER_JANITOR (per-runner cycle),
    RUNNER_POOL_READINESS (pool summary), RUNNER_POOL_DEGRADED (circuit tripped),
    GITHUB_SIDE_OUTAGE (upstream broker dead), RUNNER_PROBE_ALIVE (watchdog OK),
    RUNNER_PROBE_DEAD (watchdog alarm). Log is auto-rotated at LogMaxMB (default 5 MB).
    (g) Pure-logic regression suite at tools/runner/janitor.tests.ps1 (22 cases minimum) MUST
    pass before any change to the janitor is merged — covers circuit breaker state machine, UTC
    parse safety, per-workflow dwell lookups, broker-error parsing, queue-idle corroboration.
    Installation is via tools/runner/install-janitor-tasks.ps1 (no UAC required —
    LogonType Interactive + RunLevel Limited). Status partial — scheduled tasks must be
    installed manually after `config.cmd` registration. Promote to live once the installer is
    auto-invoked from a runner-setup script alongside provision-runner.ps1 (the same gap as
    invariant 11). Without this invariant, stuck-runner incidents waste ~60 min of pool throughput
    per occurrence + multiply the agent supervision-token cost of every PR loop.'
  applies_to:
  - ose
  - osm
  - wkrp
  - oaw
  depends_on:
  - self_hosted_runner_bash_resolution
- id: 13
  name: brain_enforcement_location
  title: Brain Enforcement Code Lives Next to Brain Content
  status: live
  test_file: audit_brain_enforcement_location.py
  enforces: 'Any script, test, or check whose purpose is to enforce the shape of OCR-docs/ocr-docs-brain/*.yaml
    (the parseable contracts governing the fleet) MUST live inside OCR-docs/ocr-docs-brain/scripts/
    or OCR-docs/ocr-docs-brain/tests/. It MUST NOT live in the workspace root (ourCommunityRituals/packages/,
    ourCommunityRituals/tools/), in any individual application repo''s .github/scripts/ or source
    tree, or in a separate ci-scripts repo. Rationale: the Brain is the single source of truth for
    OCR governance; splitting governance content from governance enforcement turns every contract
    change into a cross-repo coordination problem. Co-location means one PR, one review, one diff.
    Boundary test: enforcement code answers "is this shape correct?"; consumer code answers "give
    me the value at this path." Consumer code is allowed outside OCR-docs (e.g., the propagator
    reading product-registry.yaml, @ocr/flags generating TypeScript from flags-contract.yaml at
    build time). Enforced by: (a) human-readable standard at docs/standards/OCR_STANDARD_brainEnforcementLocation.md
    propagated to every app repo''s docs/standards/ so developers see the rule wherever they''re
    working; (b) nightly audit at .github/workflows/brain-location-audit.yml that runs
    ocr-docs-brain/scripts/audit_brain_enforcement_location.py against the workspace root and
    every app repo listed in product-registry.yaml, opens a Linear ticket on violations; (c) this
    invariant entry serving as the parseable source of truth for compliance reporting. History:
    in April 2026 the brain-conformance script was centralized into the workspace root at
    packages/ocr-ci-scripts/check_brain_contract.py. This produced noisy false-failures on stub-repo
    propagator PRs throughout April-May (OSM PRs #9, #10, #11). The fix relocated the script into
    OCR-docs alongside the Brain content. This invariant prevents the same mistake from recurring.'
  applies_to:
  - ocr-docs
  - ose
  - osm
  - wkrp
  - oaw
  - osg
  - osr
  - osp
  exceptions: []
status_summary:
