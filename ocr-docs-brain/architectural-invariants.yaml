  # ── #5 LOCAL SPONSOR COVENANT (was "Tier Equity / Pricing Governance") ───
  - id: 5
    name: tier_equity
    title: Local Sponsor Covenant
    status: live
    test_file: tier-equity.invariant.spec.ts
    enforces: Pricing tiers govern display priority within events only —
      never platform access. Local sponsors get top-of-display position
      regardless of pricing tier. Same QR system, same form quality, same
      privacy protection, same real-time counts at every tier. Local
      stays in at all flag levels.
    applies_to:
      - ose
      - osm
    depends_on:
      - sponsor-allocation.yaml
    protective_statement: >
      Pricing tiers govern display priority within events ONLY — never
      platform access. Local sponsors are guaranteed a place at every
      event, at every flag level, regardless of how much a premium buyer
      pays. This commitment is what makes OSE non-substitutable: a sponsor
      matching platform that pushes the highest bidder to the top is a
      standard ad network; OSE's covenant — that the local stays in — is
      the differentiating brand promise that creates the local-economy
      flywheel. Without this invariant, OSE collapses into a commodity ad
      auction; with it, OSE is the only platform in the market that takes
      local-economy commerce as architectural commitment.
    enforcement_statement: >
      Six-layer pyramid enforcement, all on the substrate side, all
      wired into CI:
      (a) L0 STATIC code shape —
      tests/e2e/0-architecture/tier-equity.invariant.spec.ts asserts the
      resolver declares is_local on SponsorRow, tierSort() compares
      is_local BEFORE TIER_PRIORITY, migration 0036 adds the column with
      NOT NULL DEFAULT 0, the OSE consumed copy of sponsor-allocation.ts
      cites the brain canonical, and the covenant brand promise is
      documented in the resolver header.
      (b) L0 SCHEMA + INDEX — workers/oursharedevents/tests/schema.spec.ts
      and constraints.spec.ts assert the idx_sponsors_is_local index is
      present and the sponsors table column count matches the post-OSE-330
      shape.
      (c) L0 MIGRATION SAFETY —
      workers/oursharedevents/tests/shared-report-pipeline-invariants.spec.ts
      asserts migration 0036 adds ONLY the locality classification axis
      (no other schema changes piggybacking).
      (d) L0 BRAIN↔OSE DRIFT —
      workers/oursharedevents/tests/sponsor-allocation-drift-check.spec.ts
      compares the OSE consumed copy at src/lib/sponsor-allocation.ts
      byte-for-byte against brain canonical sponsor-allocation.yaml.
      (e) L1 WORKER HTTP INTEGRATION —
      workers/oursharedevents/tests/tier-equity-sort.spec.ts uses
      SELF.fetch() to call the public /api/v2/events/:id/sponsors endpoint
      against an in-process miniflare worker, seeded with mixed-locality
      sponsors via direct D1 INSERT. 7 cases: the canonical "primary-
      local beats platinum-nonlocal" covenant assertion, within-local-
      group tier-breaks-ties, within-non-local-group tier-breaks-ties,
      full 4-sponsor mixed sort, all-local and all-non-local backward
      compat, schema NOT NULL guard.
      (f) T3 NETWORK-STAGING — postman/collections/ose-api.json section
      11 runs Newman against deployed stg.oursharedevents.com: 4 seeds
      + 1 covenant assertion + 4 cleanups via the public
      /api/v2/events/test-event-001/sponsors endpoint. Adversarial seed
      (bronze-local vs title-nonlocal) plus full 4-sponsor expected-
      order assertion. Requires CF_ACCESS_CLIENT_ID +
      CF_ACCESS_CLIENT_SECRET in CI secrets (verified present). Fail-
      loud on missing creds (not silent-skip) so cosmetic-compliance is
      impossible.
      Together: brain = source of truth for the covenant rule; gates
      a-d = no-drift enforcement at code shape, schema, migration, and
      brain contract; gate e = behavioral assertion in-process; gate f
      = behavioral assertion on the deployed worker. CI fails on any
      layer that breaks. The slot-cap floor scaffolding in
      sponsor-allocation.yaml is reserved for FUTURE surfaces that add
      capped rendering — not active today.
    references:
      brain_canonical: "ocr-docs-brain/sponsor-allocation.yaml"
      activation_story: "OSE-330 (Phase 1 brain artifact 2026-05-18; Phase 2 OSE substrate via OSE PR #249; Phase 3 T3 Newman covenant via OSE PR #251)"
      ose_consumed_copy: "workers/oursharedevents/src/lib/sponsor-allocation.ts"
      structural_test: "tests/e2e/0-architecture/tier-equity.invariant.spec.ts"
      worker_integration_test: "workers/oursharedevents/tests/tier-equity-sort.spec.ts (7 cases via SELF.fetch)"
      network_staging_test: "postman/collections/ose-api.json §11 — 4 seeds + 1 covenant assertion + 4 cleanups"
      schema_tests: "workers/oursharedevents/tests/{schema,constraints,shared-report-pipeline-invariants}.spec.ts"
      drift_check: "workers/oursharedevents/tests/sponsor-allocation-drift-check.spec.ts"
      customer_artifact: "brand-voice guidelines §2 (Voice Constant — neighborhood-rooted) + landing copy commitment language"
      brand_positioning: "false-market framing (per founder operating-system message 2026-05-17 — anonymous-but-aggregated as third option vs personal-data tracking OR no tracking)"
      template_pattern: "invariant #1 anonymous_id (rich-form template) + #10 deprecation_lock (rich live activation pattern)"
      adr: "docs/adr/ADR-013-local-sponsor-covenant-display-priority.md"
      activation_pr_substrate: "OSE PR #249 (L0 structural + L1 worker HTTP integration); OSE PR #251 (T3 network-staging Newman)"
      activation_pr_brain: "OCR-docs#PR-PENDING (this PR — partial → live + rich enrichment v2)"
    activation_note: >
      Status PARTIAL → LIVE on 2026-05-19 with the full six-layer
      pyramid evidence chain in place:
      (1) OSE PR #249 (merged 2026-05-18 sha f099d34) landed the L0
      structural invariant test + L1 worker HTTP integration test (7
      cases via SELF.fetch);
      (2) OSE PR #251 (merged 2026-05-19 sha 8796f46) landed the T3
      Newman network-staging covenant test (4 seeds + 1 assertion + 4
