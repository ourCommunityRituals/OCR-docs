# ═════════════════════════════════════════════════════════════════════════════
# Architectural invariants — CI-enforced contracts.
# ═════════════════════════════════════════════════════════════════════════════
#
# Every invariant has a dedicated test file. Status reflects CI enforcement.
#
# Two forms exist for an invariant entry:
#
#   LEAN form (legacy / minimum) — id, name, title, status, test_file,
#                                  enforces, applies_to
#   RICH form (preferred, since 2026-05-17) — adds protective_statement,
#                                  enforcement_statement, references[]
#
# Both forms validate. RICH is preferred for load-bearing invariants — its
# protective_statement names WHAT the invariant protects against; its
# enforcement_statement names HOW it's mechanically enforced; its references[]
# block trace back to the artifacts, ADRs, and CI gates that make the
# invariant real. The depth of documentation should match the load-bearing
# weight of the architectural commitment.
#
# Invariants evolve IN PLACE — when an entry transitions lean → rich, the
# number is preserved and an entry is appended to `enrichment_history` at the
# top level of this file. Never renumber. Never delete an entry.
#
# RETIRED form (added 2026-09-02, OSE-1194): when an invariant's SUBJECT ceases
# to exist (e.g. #11/#12 after the self-hosted runner fleet was decommissioned),
# its status becomes `retired`. The entry, its number and its historic
# test_file name all stay; the substrate spec may be deleted, and
# scripts/check_brain_contract.py stops requiring the file. A retirement is a
# material change and gets its own `enrichment_history` entry.
#
# `enrichment_history` is append-only and documents every lean → rich (or
# planned → live, or other material change) transition for traceability.
# Pattern established 2026-05-17 with the trio enrichment of #1 / #3 / #5.
#
# Group ordering (schema_version 1.2.0):
#   invariant_groups defines six groups in "order of operations" sequence —
#   Privacy first (the foundation), then Product, Commercial, Security,
#   Infrastructure, and Governance. Each invariant carries group, group_order,
#   and label fields. Reordering within or between groups is done by adjusting
#   group_order values only — IDs are immutable. Never renumber. Never delete.
# ═════════════════════════════════════════════════════════════════════════════

schema_version: 1.2.0
description: >
  Architectural invariants are the governance-brain-enforced contracts that
  the CI pipeline validates on every commit. Each invariant has a dedicated
  test file. Status enum: live = currently enforced in CI; partial =
  enforcement mechanism exists but not yet promoted to the 0-architecture
  suite; planned = test file and mechanism are scheduled but not yet
  implemented. Rich-form entries additionally carry protective_statement,
  enforcement_statement, and references blocks for load-bearing invariants;
  enrichments are tracked in the top-level enrichment_history field.
  Schema 1.2.0 adds invariant_groups (top-level) and group, group_order,
  label fields per invariant entry to support ordered-by-group presentation
  and future reordering flexibility without renumbering.
enforcement_gate: ose-platform-tests at org level (CI-enforced)

# ─── Invariant groups — six groups in order-of-operations sequence ──────────
# Order reflects architectural dependency: privacy is the foundation;
# product experience builds on it; commercial governance sits on top;
# security and isolation are cross-cutting; infrastructure makes CI possible;
# governance keeps the brain honest about itself.
invariant_groups:
  - id: privacy_identity
    title: Privacy & Identity
    order: 1
    description: >
      Foundation. Data never escapes as PII, outputs are aggregates-only,
      retention is bounded. Every other group depends on this being correct first.
  - id: product_experience
    title: Product & Experience
    order: 2
    description: >
      What the platform does. Geo-resolution, UEC color-semantic encoding,
      NCR data accumulation, and mobile workability on every customer surface.
  - id: commercial_governance
    title: Commercial Governance
    order: 3
    description: >
      How the business operates. The local sponsor covenant (tier equity) and
      the pre-revenue monetization gate that keeps the platform research-clean.
  - id: security_isolation
    title: Security & Isolation
    order: 4
    description: >
      Cross-cutting security. Tenant isolation prevents cross-tenant data
      leakage via dual-key pattern on every multi-tenant table.
  - id: infrastructure_ci
    title: Infrastructure & CI
    order: 5
    description: >
      Deployment layer. Deprecation locks make one-way decisions actually
      one-way. The runner-environment and pool-health invariants (#11/#12)
      are retired since 2026-09-02 (OSE-1194): CI runs on GitHub-hosted runners.
  - id: governance_brain
    title: Governance & Brain
    order: 6
    description: >
      Meta-governance. Brain artifact co-location rules ensure every brain
      enforcement script lives next to the artifact it enforces.

invariants:
  # ══ GROUP 1: PRIVACY & IDENTITY ═════════════════════════════════════════════
  # Foundation — must be correct before any other group can be trusted.

  # ── #1 ANONYMOUS ID ────────────────────────────────────────────────────────
  - id: 1
    name: anonymous_id
    label: "#1 — Anonymous ID"
    group: privacy_identity
    group_order: 1
    title: Anonymous ID
    status: live
    test_file: anonymous-id.invariant.spec.ts
    enforces: Zero-PII scan system. Two-database separation (DB / FORMS_DB).
      ose_anon cookie contract (HttpOnly, Secure, SameSite=Lax). No
      cross-linking.
    applies_to:
      - ose
      - osm
    protective_statement: >
      The brand promise "you're part of the group, anonymously" is
      load-bearing across every public surface. Drift — any code path that
      links anonymous_id to identifiable PII, any handler that crosses
      DB/FORMS_DB boundaries, any net-new raw-PII column — breaks the
      promise that lets attendees trust the platform. Privacy is not a
      feature; it is the architecture. This invariant is the deepest
      architectural commitment OSE makes; everything else (UEC, sponsor
      placement, reporting, retention) inherits its constraint that
      identifiable-attendee data cannot be correlated back from any output.
    enforcement_statement: >
      Five-layer enforcement, all wired into T0 Gate on every PR + push-to-main:
      (a) STATIC DB ISOLATION GATE — tests/architecture.spec.ts asserts:
      forms.ts NEVER references env.DB; feature-flags.ts NEVER references
      env.DB; events.ts and sponsors.ts NEVER reference FORMS_DB;
      data-subject.ts (the sole authorised cross-binder) is scope-locked to
      DELETE-only on subscribers table via DB and three explicit FORMS_DB
      tables (email_signups, form_registrations, pii_audit_log); a BROAD
      REVERSE GATE asserts that NO other handler in src/handlers/ references
      env.FORMS_DB — closes the gap where 9+ ungated handler files previously
      had no coverage (extended 2026-07-26). L2 PRAGMA assertions confirm the
      schema separation holds at the migration layer: FORMS_DB contains no
      anonymous-surface tables; DB contains no identified-user-surface tables.
      (b) PII COLUMN GATE — tests/pii-invariant.spec.ts prevents net-new
      raw-PII column names from being introduced in either database via
      migration. Covers both DB and FORMS_DB exhaustively.
      (c) COOKIE CONTRACT — src/lib/anonymous-id.ts sets the ose_anon cookie
      with all three required attributes (HttpOnly, Secure, SameSite=Lax).
      All three attributes are asserted in tests/testid-pyramid.spec.ts L3
      integration test on every PR (SameSite=Lax assertion added 2026-07-26
      closing the gap where only HttpOnly + Secure were tested). The cookie
      value is the only sanctioned correlation key.
      (d) ANONYMOUS-ID INVARIANT SPEC — tests/e2e/0-architecture/
      anonymous-id.invariant.spec.ts exercises runtime cookie semantics,
      SharedReport HTML sanitisation, and events API PII exclusion via
      Playwright. This spec requires a deployed worker and runs at T4 on
      workflow_dispatch — by design (parallel to geo-resolution, ncr-
      accumulation, and uec-codes which share the same deployed-worker
      constraint). The static and PRAGMA enforcement from (a)-(c) runs on
      every PR without a live URL.
      (e) POOL ROUTING — src/lib/pool-contract.ts REGULATORY_POOLS =
      ['general', 'hipaa', 'coppa'] segregates HIPAA/COPPA data flows
      physically from general, preventing cross-tier leakage downstream.
    references:
      adr: docs/adr/ADR-001-anonymous-identity-architecture.md
      static_gate: workers/oursharedevents/tests/architecture.spec.ts
      pii_gate: workers/oursharedevents/tests/pii-invariant.spec.ts
      cookie_contract: workers/oursharedevents/src/lib/anonymous-id.ts
      cookie_test: "workers/oursharedevents/tests/testid-pyramid.spec.ts (L3 integration: HttpOnly + Secure + SameSite=Lax asserted, extended 2026-07-26)"
      pool_routing: workers/oursharedevents/src/lib/pool-contract.ts
      data_subject_scope_guard: "workers/oursharedevents/tests/architecture.spec.ts — L1 cross-binding scope guard for data-subject.ts (added 2026-07-26)"
      broad_reverse_gate: "workers/oursharedevents/tests/architecture.spec.ts — L1 broad reverse gate: all non-authorised handlers gated against FORMS_DB (added 2026-07-26)"
      runtime_invariant_spec: "tests/e2e/0-architecture/anonymous-id.invariant.spec.ts — T4 deployed-worker spec (design constraint: requires live staging URL, parallel to geo-resolution/ncr/uec)"
      customer_artifact: "anonymity affordance rendered on every public event page (see .claude/brand-voice-guidelines.md §4.1)"

  # ── #7 AGGREGATE-ONLY REPORTING ───────────────────────────────────────────
  - id: 7
    name: aggregate_only_reporting
    label: "#7 — Aggregate-Only Reporting"
    group: privacy_identity
    group_order: 2
    title: Aggregate-Only Reporting
    status: partial
    test_file: aggregate-only.invariant.spec.ts
    enforces: >
      SharedReport endpoints return aggregates only — never individual
      records or raw anonymous identifiers. Closes the privacy story on
      the output side: Invariant #1 (Anonymous ID) guards the data at
      rest and in transit; this invariant guards what the reports
      actually surface. Six report fields (unique_gatherings,
      return_rate, corridor_density, sponsor_impressions,
      poster_attribution, headcount_trend) all return aggregate counts
      or ratios only. No anon_id_hash ever surfaces as a projected
      column. Below-min-sample fields are suppressed with structured
      reasons (S5-Q5). Corridor map cells below the privacy floor are
      suppressed. L0 structural code-shape test gates every PR + push.
    applies_to:
      - ose
    protective_statement: >
      Without an aggregate-only enforcement lock, a future refactor of
      shared-report-builder.ts could silently change `COUNT(DISTINCT
      anon_id_hash)` to `SELECT anon_id_hash` and push raw anonymous
      identifiers into every SharedReport response. The platform's
      privacy claim is "you're part of the group, anonymously" — a
      SharedReport that enumerates individual anon hashes (even hashed
      ones) contradicts that claim. Worse, with sufficient cross-event
      correlation, hashed anonymous IDs become linkable. The minimum-
      sample suppression guard (RETURN_RATE_MIN_SAMPLE >= 3) prevents
      de-anonymization via small-sample percentages: return_rate=50%
      with 2 attendees narrows a returner to one specific person. This
      invariant is the output-side complement to Invariant #1; both
      must hold simultaneously for the privacy promise to be real.
    enforcement_statement: >
      Three-layer enforcement at partial status (wired to T0 from
      2026-07-26):
      (a) L0 STRUCTURAL CODE-SHAPE LOCK —
      tests/e2e/0-architecture/aggregate-only.invariant.spec.ts (8
      cases, added 2026-07-26) asserts: shared-report-builder.ts
      exists; anon_id_hash is never a SELECT projection in builder
      queries (only COUNT(DISTINCT) or IN subquery); the SharedReport
      TypeScript interface has no raw identity fields (anon_id_hash,
      email, anon_id); RETURN_RATE_MIN_SAMPLE >= 3 constant exists;
      return_rate suppression guard exists; corridor map suppression
      exists; report-depth.ts filterReportByDepth exists; all
      anon_id_hash SQL template literals use aggregate or WHERE-only
      forms. Wired into T0 Gate `invariants` shard — gates every PR +
      push.
      (b) L1 PIPELINE INVARIANTS — workers/oursharedevents/tests/
      shared-report-pipeline-invariants.spec.ts covers: Gate 1 (no
      FORMS_DB reads in any SharedReport pipeline file) and Gate 4
      (materialization handler is cron-only, never user-facing). Runs
      in T0 vitest suite on every PR.
      (c) L1 BEHAVIOURAL — workers/oursharedevents/tests/
      shared-report-read.spec.ts covers auth + response shape for the
      read API. SharedReport builder itself is a pure function
      explicitly documented: "Returns aggregate counts only. No
      anon_id_hash ever surfaces."
      Partial→live criterion: (a) remains in 0-architecture suite AND
      a T3 network-staging test against a deployed worker asserts no
      anon_id_hash field in a real SharedReport HTTP response.
    references:
      brain_canonical: ocr-docs-brain/architectural-invariants.yaml
      structural_gate: >
        tests/e2e/0-architecture/aggregate-only.invariant.spec.ts
        (L0 structural, 8 cases, T0 Gate invariants shard — added
        2026-07-26)
      pipeline_invariants: >
        workers/oursharedevents/tests/shared-report-pipeline-invariants.spec.ts
        (Gate 1: no FORMS_DB; Gate 4: cron-only)
      builder: workers/oursharedevents/src/lib/shared-report-builder.ts
      read_handler: workers/oursharedevents/src/handlers/shared-report-read.ts
      depth_filter: workers/oursharedevents/src/lib/report-depth.ts
      companion_invariant: "Invariant #1 anonymous_id — guards data at rest; #7 guards output"
    activation_note: >
      partial→live criterion: L0 structural gate in 0-architecture
      suite (done, 2026-07-26) AND T3 network-staging test asserting
      no anon_id_hash in a live SharedReport HTTP response. T3 is not
      yet written; pending staging infrastructure.

  # ── #8 BOUNDED PII RETENTION ──────────────────────────────────────────────
  - id: 8
    name: bounded_pii_retention
    label: "#8 — Bounded PII Retention"
    group: privacy_identity
    group_order: 3
    title: Bounded PII Retention
    status: live
    test_file: pii-retention.invariant.spec.ts
    enforces: All opt-in PII has a finite TTL (expires_at,
      retention_expires_at). Daily lifecycle cron deletes expired
      registrations (90d), scrubs survey PII, deletes expired email signups
      (30d). No PII has unbounded retention. Cron + TTL columns + PRIVACY.md
      exist; structural invariant test in 0-architecture suite locks the
      cron mechanism; in-process integration test verifies behavioral
      outcome against real D1.
    applies_to:
      - ose
    protective_statement: >
      Without an automated retention lock, opt-in PII (event registrations,
      survey freeform fields, email signups) accumulates indefinitely.
      That looks like a tech-debt problem; it is actually a brand-promise
      problem and a compliance liability. OSE collects identity-bearing
      data on a covenant: you give it to participate in your community
      event; we honor it briefly; we delete it. A 90-day registration
      retention silently growing to 18 months because someone refactors
      the cron and nobody notices is not a small bug — it converts the
      platform from "ephemeral participation infrastructure" to "passive
      surveillance archive", and it does so without any visible product
      change. The retention floor is a load-bearing brand commitment;
      the cron is the load-bearing mechanism. The invariant test is the
      mechanism that makes the mechanism mechanically un-deletable.
    enforcement_statement: >
      Five-layer enforcement on the substrate side. Two of the five are
      CI-executed tests that gate every PR + push-to-main; the other
      three are the runtime hook, the audit table, and the brand-promise
      doc that those two tests lock in place:
      (a) L0 STRUCTURAL CODE SHAPE LOCK —
      tests/e2e/0-architecture/pii-retention.invariant.spec.ts (9 cases,
      added by OSE PR #252) asserts the worker entry exports
      `async scheduled()`, that scheduled() invokes runFormDataLifecycle,
      that the DELETE phases for form_registrations + email_signups
      remain keyed on expires_at / retention_expires_at (never an
      unbounded DELETE), that the SCRUB phase for form_surveys remains
      keyed on pii_scrubbed=0 → pii_scrubbed=1, that logPiiAudit() is
      called ≥6 times (3 phases × success+error paths) with INSERT INTO
      pii_audit_log, that ≥3 try blocks remain inside
      runFormDataLifecycle (phase isolation — one fail can't abort the
      others), and that the LIFECYCLE_COMPLETE structured log marker is
      emitted (SRE cron-success signal). Any refactor that silently
      drops a phase, removes a TTL column from a WHERE clause (would
      DELETE every row), removes audit writes, or collapses try/catch
      isolation fails CI at PR-time — not as a regulatory incident
      months later. This spec runs in the T0 Gate `invariants` matrix
      shard on every PR + push-to-main. That shard was created by OSE
      PR #255 / OSE-350, which wired the 0-architecture structural
      subset onto the gating path; before #255 the suite ran only in
      dispatch-only T4 Functional, so the code-shape lock did not
      actually gate normal development. tests/integration/infra-
      consistency.test.js carries a placement guard that classifies
      every 0-architecture spec structural-vs-runtime and fails CI if a
      structural spec is missing from the T0 `invariants` step — so the
      wiring itself cannot silently regress.
      (b) L1 IN-PROCESS INTEGRATION —
      workers/oursharedevents/tests/lifecycle.spec.ts exercises
      worker.scheduled() against real D1 (miniflare) with seeded rows
      for all three phases (form_registrations DELETE on expires_at,
      form_surveys SCRUB on pii_scrubbed=0, email_signups DELETE on
      retention_expires_at) and verifies pii_audit_log entries are
      written after each scheduled run. The behavioral counterpart to
      (a) — proves the code-shape locked by (a) actually executes the
      intended deletes/scrubs against a real database, not just that
      the code reads right. This spec runs in the T0 Gate `tests`
      matrix shard on every PR + push-to-main.
      (c) RUNTIME CRON TRIGGER —
      workers/oursharedevents/wrangler.toml [triggers] crons configures
      the daily fire (`0 3 * * *` — 03:00 UTC); the scheduled() handler
      at workers/oursharedevents/src/index.ts entry-point line 37 is
      the registered cron consumer; runFormDataLifecycle(env) at
      line 129 is the actual workhorse called inside ctx.waitUntil().
      Both (a) and (b) lock the existence and shape of these hooks.
      (d) PII AUDIT TABLE — pii_audit_log D1 table (schema in worker
      migrations) receives one row per (phase, success_or_error) tuple
      on every cron fire. Operators can query audit_log directly for
      compliance evidence — "show me every retention-cron action over
      the last 90 days" answers in one query. Audit writes are required
      by the L0 assertion (≥6 calls); they are not optional.
      (e) HUMAN-READABLE COVENANT — docs/features/PRIVACY.md documents
      the retention windows in plain English (90d registrations / 30d
      email signups / immediate scrub of survey freeform fields). The
      doc is the brand-promise contract surface; (a)–(d) are the
      mechanism that ensures the doc remains truthful. A refactor that
      silently extends retention without updating PRIVACY.md would
      first fail CI at (a) or (b), surfacing the inconsistency before
      the brand promise becomes a lie.
    references:
      structural_test: tests/e2e/0-architecture/pii-retention.invariant.spec.ts
      integration_test: workers/oursharedevents/tests/lifecycle.spec.ts
      cron_handler: workers/oursharedevents/src/index.ts (scheduled — line 37; runFormDataLifecycle — line 129)
      cron_config: workers/oursharedevents/wrangler.toml ([triggers] crons = ["0 3 * * *"])
      audit_table: pii_audit_log (D1 — written by logPiiAudit in src/index.ts)
      privacy_doc: docs/features/PRIVACY.md
      activation_pr: "OSE#252 — L0 structural test tests/e2e/0-architecture/pii-retention.invariant.spec.ts (9 cases) added to the 0-architecture suite (merge sha bbc161f5, 2026-05-19 12:05 UTC)"
      ci_gating_pr: "OSE#255 / OSE-350 — wired the 0-architecture structural subset (including pii-retention.invariant.spec.ts) into the T0 Gate `invariants` matrix shard so L0 gates every PR + push-to-main; before #255 the suite ran only in dispatch-only T4 Functional. T0 `invariants` shard verified green on OSE main at sha f27e8de14."
      placement_guard: "tests/integration/infra-consistency.test.js — invariant-enforcement-continuity placement guard; classifies every 0-architecture spec structural-vs-runtime and fails CI if a structural spec is not on the T0 gating path"
      origin_story: "OSE-203 / BE-14 — scheduled PII cleanup cron design + first lifecycle test"
      template_pattern: "invariant #10 deprecation_lock (rich-form CI-enforcement template)"
    activation_note: >
      Status PARTIAL → LIVE via a two-PR chain completed 2026-05-19.
      The originally-stated partial→live criterion was "promote the
      unified test to the 0-architecture suite". The honest reading of
      that criterion is that the test must not merely live in the suite
      but actually gate change — PR #252 placed it, PR #255 made it
      gate, and only the pair satisfies the criterion. Evidence chain:
      (1) OSE PR #252 added the L0 structural code-shape test
      tests/e2e/0-architecture/pii-retention.invariant.spec.ts (9 cases)
      to the 0-architecture suite — 78 of 86 tests pass, 8 unrelated WCAG
      skips, 0 regressions; (2) OSE PR #255 / OSE-350 wired the
      0-architecture structural subset (including this spec) into the
      T0 Gate `invariants` matrix shard, so the L0 lock now gates every
      PR + push-to-main — before #255 the suite ran only in
      dispatch-only T4 Functional and so did not gate normal
      development; the T0 `invariants` shard is verified green on OSE
      main at sha f27e8de14; (3) the L1 in-process integration test
      workers/oursharedevents/tests/lifecycle.spec.ts already existed
      (OSE-203 / BE-14), runs in the T0 Gate `tests` shard, and remains
      green; (4) the runtime cron handler scheduled() +
      runFormDataLifecycle in workers/oursharedevents/src/index.ts is
      wired to the daily 03:00 UTC trigger via wrangler.toml; (5) the
      pii_audit_log audit table receives one row per phase-outcome tuple
      per cron fire (operator compliance evidence); (6) PRIVACY.md
      documents the human-readable retention windows. T3 network-staging
      coverage is NOT in the pyramid for this invariant because the cron
      is a once-per-day mechanism, not a per-request behavior — L0 + L1
      prove the mechanism without needing to observe a deployed cron
      fire against staging. This invariant has NO dependency on OSE-349
      (the CF Access service-token rotation that currently holds the
      unrelated T3 sponsor-covenant check); brain #8 was never blocked
      on it. This is the second invariant to use the rich-form
      activation pattern; mirrors the rigor of #10 deprecation_lock
      (which flipped 2026-05-18 via OSE PR #249 / OCR-docs#56) and
      inherits the layered-enforcement template that #1 anonymous_id
      established (2026-05-17 trio enrichment).

  # ══ GROUP 2: PRODUCT & EXPERIENCE ═══════════════════════════════════════════
  # What the platform does — built on the privacy foundation above.

  # ── #2 HYPERLOCAL GEO-RESOLUTION ──────────────────────────────────────────
  - id: 2
    name: hyperlocal_geo_resolution
    label: "#2 — Hyperlocal Geo-Resolution"
    group: product_experience
    group_order: 1
    title: Hyperlocal Geo-Resolution
    status: live
    test_file: geo-resolution.invariant.spec.ts
    enforces: >
      sponsor_areas + sponsor_event_types tables power corridor-level
      sponsor resolution. Two resolution paths: (a) direct — sponsor.event_id
      matches the requested event; (b) template+geo — sponsor matches event
      template_id AND the sponsor's service area (zip_code match OR haversine
      radius match). Deduplication: same sponsor via both paths appears once.
      Rotation ORDER and per-surface treatment are NOT governed here: sponsor
      rotation is set by Invariant #25 (sponsor_share_covenant) as a
      capped/floored UNIFORM frequency-share. The locals-first tier sort
      (title > platinum > gold > silver > bronze > primary) and the named-slot
      surface filter (display→tvTop|tvSide, poster→posterTop, public→
      mobileBanner, sharedReport→all) are RETIRED — superseded by #5 and #25 —
      and MUST NOT be reintroduced. #2 scopes WHICH sponsors resolve to a
      corridor; it never sets their order, size, or slot (X-7 / OSE-839).
    applies_to:
      - ose
    protective_statement: >
      The local-sponsor covenant — "the bar around the corner gets the
      same reach as a national brand" — depends on the geo-resolution
      engine correctly scoping sponsor visibility to the corridor where
      the sponsor actually operates. Without this invariant, a geo bug
      could surface a national sponsor in place of the local one (silent
      covenant breach), or surface no sponsors at all (empty placement
      slots). Either failure erodes the Triangle premise: sponsors see
      value only when their local footprint maps to real events in their
      geography.
    enforcement_statement: >
      Enforced at live status by four layers — note (a) is runtime and runs
      T4-only (it SKIPS on PRs), so (d) is the on-every-PR structural gate:
      (a) L1 INTEGRATION TEST SUITE — tests/e2e/0-architecture/
      geo-resolution.invariant.spec.ts (10 cases, runtime: uses page
      fixture against deployed worker) asserts: direct-path resolution,
      template+geo resolution, zip_code matching, haversine radius
      matching, tier-order-INDEPENDENCE of response order (rotation is
      governed by #25's uniform frequency-share, NOT a tier sort — the
      retired tier-sort/named-slot rules are guarded against reintroduction),
      sponsor deduplication across
      resolution paths, rotation timing bounds, rotation slot scaling,
      event-types API accepts template associations, service-areas API
      accepts geo areas. Runs in T4 Functional (dispatch-only, requires
      deployed worker at ADMIN_KEY). 3 of 10 cases skip when base URL
      is absent — skips are expected behavior, not gaps.
      (b) SCHEMA LOCK — migrations/0019_create_sponsor_event_types.sql,
      0020_create_sponsor_areas.sql, 0021_add_geo_to_events.sql define
      the tables and columns the resolver depends on. Any migration that
      drops these columns would break the integration tests at deploy-
      time before going to production.
      (c) DEMO GEO-REALIZABILITY (OSE-997) — a demo/venue's H3 cell must
      resolve inside its NAMED corridor. corridor-definitions.yaml owns each
      founding corridor's authoritative geo (geo.anchor_h3_res7 + bbox); the
      product's demo data must stamp the brain's corridor anchor. Enforced
      cross-repo by check_brain_contract.py:check_demo_geo_in_corridor (the
      brain gate reads the anchor and the repo's RIPH_H3_RES7 — mismatch is
      drift) and exhaustively by riph-brain-conformance.spec.ts
      (@brain-conformance 2), which decodes every demo cell and asserts it
