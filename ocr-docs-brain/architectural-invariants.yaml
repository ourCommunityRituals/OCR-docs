  # ── #22 CROSS-REPO IMPORT ISOLATION ───────────────────────────────────────
  - id: 22
    name: cross_repo_import_isolation
    label: "#22 — Cross-Repo Import Isolation"
    group: security_isolation
    group_order: 6
    title: Cross-Repo Import Isolation
    status: live
    enforcement_kind: brain_script
    # brain_script (OSE-1288 / F13 PR-1b part 2): the canonical enforcing guard
    # is the brain-resident, live-read check_cross_repo_imports.py — NOT a
    # repo-local file. Conformance (check_brain_contract._guard_step_wired)
    # verifies each applies_to product WIRES a PR-blocking, un-neutered workflow
    # step invoking it; presence of a file is no longer the test. Per-product
    # severity is the live-read enforcement_mode plane in
    # scripts/cross_repo_patterns.json: default `block` hard-fails (OSE, wired
    # today); a spoke whose own side of the seam is not built yet (WKRP OW-112,
    # OAW deferred) runs in `warn` — surfaced as a loud fleet signal, not a block.
    test_file: ocr-docs-brain/scripts/check_cross_repo_imports.py (OCR-docs brain — live-read canonical guard)
    # COMPOSITION invariant: the OSE×OW forbidden-join boundary only exists at
    # the SEAM between products — it is meaningless for either repo in isolation
    # (a standalone repo has no sibling to import). Each participating repo
    # carries its OWN gate once its side of the seam is built; `lives_in` lists
    # who currently owns one. OSE ships scripts/check-cross-repo-imports.sh
    # today; the WKRP/OAW-side mirror gate is tracked by OW-112 (and the
    # hybrid-identity Bridge contracts, OCR-43). Until then WKRP/OAW are
    # PROTECTED by this invariant (they appear in applies_to) but are not
    # required to carry the artifact — OCR-41 ownership axis. When OW-112 lands,
    # add wkrp to lives_in (it accepts a list).
    lives_in:
      - ose
    enforces: >
      No module-level import (import/require/file:/workspace: dependency)
      may cross the OSE / WKRP / OAW repo boundary. The only permitted
      cross-repo data flow is the OER aggregation boundary: the HTTP API
      seam at GET /api/events/:id/music (WKRP exposes, OSE calls via HTTP
      fetch). Shared OCR packages (@ocr/flags, @ocr/ui under packages/)
      are explicitly permitted — they are designed cross-product packages.
    applies_to:
      - ose
      - wkrp
      - oaw
      - osm
      - osp
      - osr
      - osg
    protective_statement: >
      OSE and WKRP carry opposite identity invariants — OSE is anonymous
      by construction; WKRP is named with voluntary attribution. A
      module-level import across this boundary would silently couple the
      two identity models at the code level, making it trivially easy to
      introduce an inadvertent identity leakage path that bypasses the HTTP
      API boundary and its CORS controls. The HTTP API seam
      (GET /api/events/:id/music) is the one documented boundary; it is
      covered by Pact contract testing (OSE-423) and CORS origin controls
      in WKRP's privacy.ts. Module imports would bypass both.
    enforcement_statement: >
      L0 SCRIPT GATE — scripts/check-cross-repo-imports.sh in the OSE repo
      scans workers/**/*.ts, workers/**/*.js, and both package.json files
      for prohibited import patterns on every PR via brain-contract-check.yml
      (step: "Invariant #22 — cross-repo isolation gate (OCR-ENF-23)").
      Prohibited patterns: import ... from '@ourwkrp/...', from
      '@oursharedevents/...', from '@ourairwaves/...'; require('ourwkrp/...'),
      require('oursharedevents/...'); file:../../ourWKRP or
      workspace:../ourWKRP in package.json. URL strings
      (https://ourwkrp.com) and CORS origin checks are not violations —
      they are the expected HTTP API seam surface.
      Audit 2026-08-02: zero violations in OSE + WKRP source.
      OAW audit (OCR-ENF-22) deferred until OAW is active.
      UPDATE (OSE-1288 / F13): the canonical enforcing guard is now the
      brain-resident, live-read check_cross_repo_imports.py; OSE's
      brain-contract-check.yml invokes it and conformance verifies the wiring
      per enforcement_kind: brain_script. The OSE-local check-cross-repo-imports.sh
      is superseded (retirement tracked as a follow-up).
    references:
      enforcement_script: ocr-docs-brain/scripts/check_cross_repo_imports.py (OCR-docs brain — canonical, live-read)
      enforcement_mode_plane: ocr-docs-brain/scripts/cross_repo_patterns.json (per-product block/warn; read live from OCR-docs/main)
      wiring_gate: ocr-docs-brain/scripts/check_brain_contract.py::_guard_step_wired (verifies each applies_to product wires a PR-blocking step)
      ci_workflow: .github/workflows/brain-contract-check.yml (OSE repo — step invokes the live-read brain guard)
      legacy_local_script: scripts/check-cross-repo-imports.sh (OSE repo — superseded by the live-read brain guard; retirement tracked as follow-up)
      audit_doc: docs/security/INVARIANT_22_CROSS_REPO_IMPORT_ISOLATION.md (OSE repo)
      permitted_seam: "GET /api/events/:id/music — WKRP exposes, OSE calls via HTTP"
      pact_coverage: "OSE-423 F2.3 — Pact at the frozen music seam"
      activation_pr: "OSE PR #291 — feat(security): Invariant #22 cross-repo isolation audit + CI gate (OSE-388, OSE-389)"
      brain_script_pr: "OSE-1288 / F13 — PR-1a (canonical brain guard), PR-1b (conformance wiring + enforcement_kind flip + live-read mode plane)"

  # ── #23 RED TEAM COVERAGE ────────────────────────────────────────────────────
  - id: 23
    name: red_team_coverage
    label: "#23 — Red Team Coverage"
    group: security_isolation
    group_order: 7
    title: Red Team Coverage
    status: partial
    test_file: tests/red-team/ (OSE repo — in construction, OSE-564)
    enforces: >
      Red team testing is an invariant across infrastructure. No layer ships
      without adversarial coverage. Every red team test is born red — the test
      is first demonstrated failing against a deliberately-broken fixture before
      its green run counts. Coverage is enumerated against a written threat
      ledger per layer. New layers (voting rounds, league tables, Stripe
      read-only ingestion) arrive with their attacker list as part of their
      brain landing.
    applies_to:
      - ose
      - wkrp
      - oaw
      - ocr
    protective_statement: >
      The attack surface of an AI-assisted platform expands faster than any
      manually-maintained threat model can track. Without a structural invariant
      requiring adversarial coverage on every layer, security coverage drifts to
      the layers that are easiest to test, leaving the rest untested by
      assumption. The threat ledger makes "across infra" answerable: here is
      every layer, here is every threat we have named, here is the test, here
      is the date it was last run red-capable and green-passing. A gap is a gap
      — it renders as a gap in the conformance report, not as a silent pass.
      This invariant exists because "we test security" is not the same as
      "we enumerate the attacks and prove each one is covered."
    enforcement_statement: >
      PARTIAL — enforcement infrastructure is in construction (OSE-564).
      Target enforcement: two-part harness. (1) THREAT LEDGER — a committed,
      versioned document (docs/security/threat-ledger.yaml or equivalent) in
      each repo enumerating attack scenarios per infrastructure layer. Ledger
      entry schema: id, target_invariant (number + name), test_reference,
      status (covered/open/deferred). Every ledger entry references a test.
      Every new infrastructure layer's brain landing must include a ledger
      section — enforced by PR template. (2) BORN-RED GATE — CI convention
      proving each red team test was first demonstrated catching its violation
      before its green run counts. Annotation scheme tags each test to its
      ledger entry + invariant number. A red team test with no recorded red
      birth fails the OSE-560 conformance report. Full enforcement wires when
      OSE-564 (threat ledger + born-red harness) and OSE-560 (conformance
      report generator) both land.
    references:
      linear_epic: "OSE-558 — Auditable Architectural Reality"
      linear_story: "OSE-564 — Threat ledger + born-red harness"
      companion_invariant: "#24 auditability (conformance report generator)"
      activation_criterion: >
        OSE-564 landed (threat ledger committed, born-red harness in CI) AND
        OSE-560 landed (conformance report generator producing per-invariant
        evidence). Promote to live at that point.

