# Enrichment History — append-only record of lean → rich (and other material)
# invariant transitions. Documents the evolution of the registry over time so
# future maintainers can trace WHY each invariant got the depth of
# documentation it has, and HOW the pattern itself evolved.
#
# Pattern rule: when an invariant entry is materially expanded or its status
# changes from planned/partial → live (or vice versa, with rationale), append
# an entry here. NEVER delete past entries. NEVER renumber invariants. The
# history is the contract.
# ═════════════════════════════════════════════════════════════════════════════
