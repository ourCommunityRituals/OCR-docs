  # ── #6 INERT MONETIZATION HOOKS ───────────────────────────────────────────
  - id: 6
    name: inert_monetization_hooks
    label: "#6 — Inert Monetization Hooks"
    group: commercial_governance
    group_order: 2
    title: Inert Monetization Hooks
    status: live
    test_file: monetization-inert.invariant.spec.ts
    enforces: >
      X-Monetization-Inert: true header on every HTTP response, set by the
      fetch() wrapper in src/index.ts. The wrapper clones the response via
      new Response(response.body, response) and patches the header — covers
      both success and error (500) paths. No billing logic executes at any
      code path. No Stripe, charge, or debit patterns in any src/ file.
      Structural L0 gate (5 cases) asserts the wrapper exists in T0.
      L1 in-process tests in testid-pyramid.spec.ts assert the header
      appears on real miniflare responses (public API, admin API, 404).
    applies_to:
      - ose
    research_note: >
      This invariant is the reason research data can be collected cleanly
      before revenue activation. Pre-revenue by contract, not by choice.
    protective_statement: >
      A monetization hook that inadvertently executes billing logic before
      the revenue decision is made would convert collected research data into
      unauthorized billable activity. The X-Monetization-Inert header is the
      machine-readable assertion — on every response, not just logged at
      startup — that no such execution happened during the request.
    enforcement_statement: >
      Two-layer enforcement at partial status (T0-wired from 2026-07-26):
      (a) L0 STRUCTURAL CODE-SHAPE LOCK —
      tests/e2e/0-architecture/monetization-inert.invariant.spec.ts (5
      cases, added 2026-07-26) asserts: src/index.ts exists; the header
      is set with value 'true'; the patching uses new Response(body, init)
      to preserve all handler-set headers; no Stripe/billing patterns exist
      in any src/ TypeScript file; the let response pattern ensures both
      success and error paths are covered. Wired into T0 Gate `invariants`
      shard — gates every PR + push.
      (b) L1 IN-PROCESS — workers/oursharedevents/tests/
      testid-pyramid.spec.ts: three integration tests assert the header
      appears on: GET /api/v2/events (public), GET /api/v2/admin/events
      (admin), and a 404 response (error path).
      Partial→live criterion: L0 structural gate in 0-architecture suite
      (done, 2026-07-26) AND the story-f4 contract test suite adds the
      header assertion to the Newman collection for T3 coverage.
    references:
      index_wrapper: workers/oursharedevents/src/index.ts (fetch() wrapper, line 17-38)
      structural_gate: >
        tests/e2e/0-architecture/monetization-inert.invariant.spec.ts
        (5 cases, T0 Gate invariants shard — added 2026-07-26)
      integration_tests: >
        workers/oursharedevents/tests/testid-pyramid.spec.ts
        (L3 integration: 3 tests asserting header on real responses)
    activation_note: >
      Status PARTIAL → LIVE 2026-07-26. Evidence chain:
      (a) L0 structural gate: monetization-inert.invariant.spec.ts (5 cases,
      T0 Gate invariants shard, added 2026-07-26) — code-shape-locks the
      X-Monetization-Inert header set in index.ts fetch() wrapper.
      (b) L1 in-process: testid-pyramid.spec.ts (3 integration tests asserting
      header appears on real responses: public API, admin API, 404 path).
      (c) T3 Newman contract: postman/collections/ose-api.json collection-level
