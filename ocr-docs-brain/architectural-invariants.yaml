        - "Input font-size ≥ 16 px — Tailwind text-base floor — suppresses iOS auto-zoom"
        - "Text contrast WCAG AA at minimum on every readable surface"
        - "Primary CTA above the fold without scroll on the floor viewport"
        - "No horizontal scroll at 375 px viewport"
