  # ── #14 MOBILE WORKABILITY ────────────────────────────────────────────────
  # Added 2026-06-01 to resolve a second phantom (same failure mode as #13):
  # OCR_STANDARD_mobileWorkability.md (effective 2026-05-16) referenced
  # "invariant 14" four times — in the exception-allowlist procedure (line
  # 104), enforcement layer 3 (line 168), the history block (line 212), and
  # the first-validation history entry (line 214) — yet #14 was never
  # encoded here. ADR-002 (accepted 2026-05-22) also proposed numbers 14
  # and 15 for explicit_identity and exit_always_available, with the
  # explicit flag that those numbers were indicative ("Invariant numbers
  # are indicative — assigned at implementation per the brain's write-time
  # numbering rule"). The mobileWorkability claim is senior — predates
  # ADR-002 by six days, has a deployed OSE audit, and is propagated to
  # every product's vendored .ocr-standards/. ADR-002's proposals shift
  # to #15 and #16 at implementation. Resolves Linear OCR-74.
  - id: 14
    name: mobile_workability
    label: "#14 — Mobile Workability"
    group: product_experience
    group_order: 4
    title: Mobile Workability
    status: partial
    test_file: mobile-workability.invariant.spec.ts
    enforces: 'Every customer-facing surface in every OCR product MUST be
      usable at the 375×812 viewport (iPhone 13 Mini / X / 11 Pro — the
      smallest modern iPhone in significant active use). Five contracts per
      surface: (1) no horizontal scroll at 375 px viewport, (2) tap targets
      ≥ 44×44 pt, (3) text font-size ≥ 16 px and contrast WCAG AA, (4)
      primary CTA above the fold without scroll, (5) input font-size ≥ 16
      px to suppress iOS auto-zoom on focus. Per-product Playwright audit
      at `tests/playwright/mobile-workability.spec.ts` exercises each
      customer-facing surface against the five contracts. Documented
      exemptions: /display (venue TV — landscape kiosk) and /briefing
      (internal CEO tool). Additional exemptions added inline in the
      standard. Status partial — the audit exists in OSE (first validation
      2026-05-16, OSE audit run 25951483089). Promote to live per-product
      when the audit lands in that product''s CI, passes for every
      customer-facing surface, and per OCR-53 the conformance check
      verifies the audit is invoked by an active workflow.'
    applies_to:
      - ose
      - osm
      - wkrp
      - oaw
      - osr
      - osg
    exceptions: []
    protective_statement: >
      Every OCR product is a mobile product first. The customer surface —
      the page someone is looking at on their phone at 7am at the bus stop
      — must be usable on the smallest modern iPhone viewport (375×812).
      Drift — surfaces that require horizontal scroll, tap targets smaller
      than 44 pt, input fonts that trigger iOS zoom, primary CTAs below
      the fold, text that fails contrast at common phone brightness —
      turns the brand promise into a lie surface-by-surface. The customer
      doesn't experience the *intended* layout; they experience the
      *broken* layout. The audit is the mechanism that keeps the intent
      honest at scale across every product, every release.
    enforcement_statement: >
      Four-layer enforcement per product:
      (a) Per-product Playwright audit at
      `<product>/tests/playwright/mobile-workability.spec.ts` exercises
      each customer-facing surface against the five contracts above.
      (b) Nightly + on-PR workflow runs the audit — same shape as
      brain-location-audit.yml. On PR runs the audit is informational
      (does not block); on schedule + manual dispatch it blocks and
      opens a Linear ticket on violation (the L5 auto-drift mechanism,
      per ADR-003).
      (c) Exemption list — /display (venue TV — landscape kiosk) and
      /briefing (internal CEO tool) are documented exemptions inline in
      the standard. The audit reads the exemption list; if /briefing
      ever becomes customer-facing, the exemption is removed and the
      audit picks up the gap on the next run.
      (d) Propagated standard —
      OCR-docs/docs/standards/OCR_STANDARD_mobileWorkability.md is
      canonical and is fanned out to every product's
      `.ocr-standards/standards/` via the standards propagator (Linear
      OCR-75 Epic). Every developer in any OCR repo sees the rule
      locally. Drift between vendored and canonical fails CI on the
      product side once OCR-75 ships.
      Status partial because (a) only ships in OSE today; partial → live
      per-product as audits land in each product's CI.
    references:
      standard: docs/standards/OCR_STANDARD_mobileWorkability.md
      ose_audit: "ourSharedEvents/tests/playwright/mobile-workability.spec.ts"
      first_validation: "OSE audit run 25951483089 (2026-05-16) — first full validation cycle, surfaced three standard-debt items refined by OCR-42 (WCAG 2.5.5 inline-text-link exemption; page-state steady-state model; error-page sub-contract)"
      adr_coordination: "ADR-002 — its proposed invariants explicit_identity and exit_always_available shift to #15 and #16 at implementation, per the ADR's own 'numbers are indicative' note"
      doctrine_link: "ADR-003 — this invariant's enforcement layer (b) is the manual-invoke version of the L5 auto-drift-tickets mechanism the framework's self-improvement loop will automate"
      linear_epic: "OCR-74 — phantom #14 resolution"
      origin: "CCR review 2026-06-01 — resolved a phantom #14 referenced by six artifacts (mobileWorkability standard ×4, ADR-002 ×2) but never encoded. Sibling cleanup: OCR-53 (phantom-number guard in conformance check); OCR-75 (re-propagation to vendored .ocr-standards copies)."
    # ── Role sections (ADR-004 worked example — first backfill 2026-06-01) ──
    # Demonstrates that all six role sections defined in ADR-004 (Role-Ready
    # Invariants) can be populated for a real invariant without contortion —
    # the proof point that converts ADR-004 from Proposed to ready-for-CCR.
    # Per OCR-76 (Phase 1 sub-Story under OCR-49), `level2_schema.py` will
    # validate these section shapes when schema v2.0.0 lands. Today they are
    # forward-compatible documentation: the current validator (INV_REQUIRED
    # check) ignores unknown fields, so this backfill is harmless. When the
    # validator extension ships, the existing data already satisfies it.
    pm:
      acceptance_criteria:
        - "Every customer-facing surface in <product> passes the five-contract audit at 375×812"
        - "Audit runs nightly on schedule (blocking) and on every PR (informational)"
        - "Drift opens a Linear ticket via the L5 auto-drift mechanism"
        - "Each documented exemption (/display, /briefing, future) has rationale inline in the standard"
      user_impact: >-
        Mobile-first audience. The customer experiences the broken layout
        surface-by-surface and trust erodes silently — there is no error
        page, no exception, no recovery moment.
      sprint_decomposition: >-
        Per-product: 1 sprint to wire the audit + bring the first surface
        list into compliance. The OSE audit (2026-05-16) is the reference
        implementation. WKRP, OSM, OAW each take their own sprint to reach
        all five contracts on every customer-facing surface.
    devops:
      ci_gates:
        - "<product>/.github/workflows/mobile-workability-audit.yml"
      secrets: []
      deploy_gates:
        - "staging — blocking on nightly schedule; informational on PR"
      rollback: >-
        No runtime rollback. This is a pre-deploy gate. If a violation
        ships via override (--no-verify, workflow skip), the next nightly
