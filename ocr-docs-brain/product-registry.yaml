schema_version: 1.0.0
org: OurCommunityRituals
legal_entity: OurCommunityRituals LLC
github_org: https://github.com/OurCommunityRituals
oureventring:
  description: 'BigQuery RAG data warehouse. The gravity well. Every product line is a data collection
    surface feeding this single destination. Write-from-day-one, read-later.

    '
  pools:
    general:
      dataset: oureventring_general
      regulatory_constraint: none
      access_control: standard_rbac
      encryption: platform_default
      audit_logging: standard
      aggregate_contribution_method: passthrough
    # HIPAA and COPPA are DECLINED regimes (OCR_STANDARD_declinedRegimes.md,
    # ratified 2026-09-04; OSE-1220). No OCR product writes to these datasets;
    # they are retained as records of what is refused, NOT active pools. See the
    # declined leaf schemas bigquery-schemas/{hipaa,coppa}.json. SOPPA (student
    # data) is declined without ever being modeled — no pool entry exists.
    hipaa:
      status: declined
      declined_by: OCR_STANDARD_declinedRegimes.md (ratified 2026-09-04; OSE-1220)
      dataset: oureventring_hipaa
      regulatory_constraint: HIPAA — Health Insurance Portability and Accountability Act
      access_control: baa_required
      encryption: separate_keys
      audit_logging: mandatory_full
      aggregate_contribution_method: safe_harbor_18
    coppa:
      status: declined
      declined_by: OCR_STANDARD_declinedRegimes.md (ratified 2026-09-04; OSE-1220)
      dataset: oureventring_coppa
      regulatory_constraint: COPPA — Children's Online Privacy Protection Act
      access_control: parental_consent_framework
      encryption: separate_keys
      audit_logging: mandatory_full
      aggregate_contribution_method: coppa_aggregation
    aggregate:
      dataset: oureventring_aggregate
      description: 'Fourth layer. De-identified, aggregated contributions flow here from the active
        source pools. This is what the RAG reads. This is where cross-pool community intelligence lives.
        No PII, no PHI, no individual minor data. Corridor-level behavioral density only. HIPAA and COPPA
        are declined regimes (OSE-1220) and contribute nothing — only ''general'' is an active source.

        '
      # Only 'general' is an active source. HIPAA and COPPA are declined regimes
      # (OCR_STANDARD_declinedRegimes.md, OSE-1220) — they contribute no data and
      # are deliberately absent from this list. See bigquery-schemas/aggregate.json.
      source_pools:
      - general
      access_control: standard_rbac
      encryption: platform_default
      audit_logging: standard
