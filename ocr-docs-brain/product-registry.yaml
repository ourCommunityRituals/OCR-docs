- product_id: ose
  product_name: ourSharedEvents
  layer: anonymous
  repo: OurCommunityRituals/ourSharedEvents
  npm_scope: '@oursharedevents'   # Invariant #22 sibling-scope source (check_cross_repo_imports.py)
  repo_status: active
  identity_layer: anonymous
  description: 'Default app. Backend architecture + frontend triangle. Whitelabel-capable via OSM combinations.
    The primary data collection surface.

    '
  # OSE-1220 (OCR_STANDARD_declinedRegimes.md, ratified 2026-09-04; SOPPA added
  # 2026-09-10): HIPAA, COPPA and SOPPA are DECLINED regimes for OSE, not tiers
  # it matures into — there is no roadmap on which OSE acquires them. Item-
  # tracking serves health-/child-/student-adjacent contexts in the 'general'
  # pool without entering a declined regime. OSE routes to 'general' only;
  # phaseToPool(4|5) refuses in code. SOPPA (student data) is declined without
  # ever being modeled — no pool, no dataset, no schema.
  regulatory_pools:
  - general
  data_contributor: true
  anonymization_method: full
  aggregate_contribution_method: passthrough
  data_schema_version: 1.0.0
  required_tags:
  - corridor_id
  - venue_id
  - event_type
  - uec_code
  - regulatory_pool
  - product_id
  pipeline_activation_phase: 1
  bigquery_datasets:
    general: oureventring_general
  funnels_to:
  - oureventring
  tier_availability:
    phase1:
    - free
    - mid
    phase2:
    - free
    - mid
    phase3:
    - free
    - mid
    phase4:
    - free
    - mid
    - premium
    phase5:
    - free
    - mid
    - premium
