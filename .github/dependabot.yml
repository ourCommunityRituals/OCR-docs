# Keeps pinned actions current (OCR-231). Workflows and composite actions pin
# by full commit SHA with the tag as a comment; Dependabot proposes the new SHA
# as a reviewed PR when the tag moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a hijacked or broken
    # release has time to be caught upstream (CCR F5; tests/check_action_pins.py).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
