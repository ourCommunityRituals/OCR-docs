# action-pins.yml
# ----------------------------------------------------------------------------
# Every action OCR-docs runs is pinned by commit, and a read token used for a
# checkout is never written to disk (OCR-231; CCR security sweep 2026-11-25).
# The self-test runs first: each rule must catch its planted fault, or the
# check on the real files is not trusted.
# ----------------------------------------------------------------------------
name: Action pins

on:
  pull_request:
    paths:
      - '.github/**'
      - 'tests/check_action_pins.py'
      - 'tests/check_workflow_injection.py'
      - '.claude/settings.json'
      - 'tests/check_agent_settings.py'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'tests/check_action_pins.py'
      - 'tests/check_workflow_injection.py'
      - '.claude/settings.json'
      - 'tests/check_agent_settings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: actions pinned by commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Self-test (each rule catches its planted fault)
        run: python3 tests/check_action_pins.py --self-test
      - name: Check the real workflows and composite actions
        run: python3 tests/check_action_pins.py
      - name: Injection self-test (CCR F17)
        run: python3 tests/check_workflow_injection.py --self-test
      - name: No caller text in run scripts; exact repo scope (CCR F17)
        run: python3 tests/check_workflow_injection.py
      - name: Agent settings self-test (CCR F1)
        run: python3 tests/check_agent_settings.py --self-test
      - name: Shared agent settings deny the dangerous commands (CCR F1)
        run: python3 tests/check_agent_settings.py
