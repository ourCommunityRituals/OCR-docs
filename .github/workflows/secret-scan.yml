# secret-scan.yml
# ----------------------------------------------------------------------------
# OCR-130 — the authoritative "no credential in the brain" gate.
#
# OCR-docs propagates ×~8 to every spoke, so a committed credential multiplies
# across the org. `.gitignore` is only name-based defense-in-depth and is
# porous (a `docs/! gh secret set ...txt` scratch slipped past it on
# 2026-09-03). OCR_STANDARD_reconciliationLoop §8 rule 4 names a CONTENT
# scanner the authoritative gate; this workflow is it.
#
# Standardized on detect-secrets (pure Python) per OSE-911 — gitleaks' WASM
# JIT panicked nondeterministically on the old Windows runners. The gate logic
# is ocr-docs-brain/scripts/check_secrets_baseline.py (a port of OSE's), which
# fails ONLY on a secret not already accepted in the committed .secrets.baseline.
# ----------------------------------------------------------------------------
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: detect-secrets (content gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install detect-secrets
        # Pinned so a scanner upgrade can't silently reclassify the baseline.
        run: pip install --disable-pip-version-check 'detect-secrets==1.5.0'

      # Born-red self-test: a gate that cannot be shown to BITE is not a gate.
      # Plant a fake credential in a tracked file (an innocuously-named .md, to
      # prove the scan is filename-agnostic), run the checker, and assert it
      # FAILS. If detect-secrets ever stops catching this, THIS step goes red
      # before the real gate below can hand out a false clean pass.
      - name: Self-test — scanner must catch a planted secret
        run: |
          printf 'aws_secret_access_key = AKIAIOSFODNN7EXAMPLE\n' > _selftest_secret.md
          git add _selftest_secret.md
          set +e
          python ocr-docs-brain/scripts/check_secrets_baseline.py
          rc=$?
          set -e
          git rm -q --cached _selftest_secret.md
          rm -f _selftest_secret.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::secret scanner did NOT catch a planted AWS key - the gate is vacuous"
            exit 1
          fi
          echo "OK: planted secret was caught (gate bites, exit $rc)."

      # The real gate: fail closed on any secret not present in .secrets.baseline,
      # regardless of the file's name or extension.
      - name: detect-secrets gate
        run: python ocr-docs-brain/scripts/check_secrets_baseline.py
