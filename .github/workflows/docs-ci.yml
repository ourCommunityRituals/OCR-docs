# docs-ci.yml
# Reusable workflow for docs-as-code repos.
# Checks markdown lint and verifies required files exist.
# Called by product repos via workflow_call.

name: Docs CI

on:
  workflow_call:
    inputs:
      required_files:
        description: 'Comma-separated list of required files'
        required: false
        default: 'CLAUDE.md,README.md,SKILL.md'
        type: string

# Pin bash explicitly (harmless on ubuntu-latest, whose default is already bash) so run steps are shell-deterministic regardless of runner.
defaults:
  run:
    shell: bash

jobs:
  lint-and-check:
    name: Markdown lint + DAC compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          IFS=',' read -ra FILES <<< "${{ inputs.required_files }}"
          MISSING=0
          for FILE in "${FILES[@]}"; do
            FILE=$(echo "$FILE" | xargs)  # trim whitespace
            if [ ! -f "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              MISSING=$((MISSING + 1))
            else
              echo "Found: $FILE"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING required file(s) missing"
            exit 1
          fi

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          # Lint all markdown files, warn but don't fail on style issues
          # Fail only on errors that break rendering
          markdownlint '**/*.md' \
            --disable MD013 MD033 MD024 MD036 MD041 MD025 \
            || true

      - name: Check for broken internal links
        run: |
          # Don't fail — just warn. Cross-repo links are expected unresolvable.
          # -oE (ERE) is enough for this pattern; no PCRE (-oP) needed.
          grep -roh '\[.*\]([^http][^)]*\.md)' --include='*.md' . \
            | grep -oE '\(([^)]+)\)' \
            | tr -d '()' \
            | sort -u \
            | while read -r LINK; do
                if [ ! -f "$LINK" ]; then
                  echo "::warning::Broken link: $LINK"
                fi
              done \
            || true
