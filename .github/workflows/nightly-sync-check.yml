# nightly-sync-check.yml
# Runs every night at 6am UTC (midnight CST).
# Checks all product repos for DAC compliance and standards drift.
# Opens an issue in OCR-docs if anything is out of sync.
# Does not modify any repo — read-only audit.

name: Nightly Sync Check

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC = midnight CST
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Include per-file details in report'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

env:
  ORG: ourCommunityRituals
  REPOS: >-
    ourSharedEvents
    ourWKRP
    ourSharedGames
    ourSharedRecords
    ourSharedPulse
    ourSharedMagnets
    ourAirwaves

# Pin bash explicitly (harmless on ubuntu-latest, whose default is already bash) so run steps are shell-deterministic regardless of runner.
defaults:
  run:
    shell: bash

jobs:
  sync-check:
    name: Audit all repos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OCR-docs
        uses: actions/checkout@v4

      - name: Run sync audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.OCR_SPOKES_READ }}
        run: |
          REPORT=""
          FAILURES=0
          WARNINGS=0
          TOTAL_REPOS=0

          # Get current template hashes for drift detection
          CLAUDE_HASH=""
          SKILL_HASH=""
          ADR_HASH=""
          if [ -f templates/CLAUDE-base.md ]; then
            CLAUDE_HASH=$(sha256sum templates/CLAUDE-base.md | cut -d' ' -f1)
          fi
          if [ -f templates/SKILL-template.md ]; then
            SKILL_HASH=$(sha256sum templates/SKILL-template.md | cut -d' ' -f1)
          fi
          if [ -f templates/OCR_TEMPLATE_adr.md ]; then
            ADR_HASH=$(sha256sum templates/OCR_TEMPLATE_adr.md | cut -d' ' -f1)
          fi

          VISION_HASH=""
          DEPMAP_HASH=""
          if [ -f docs/OCR_VISION.md ]; then
            VISION_HASH=$(sha256sum docs/OCR_VISION.md | cut -d' ' -f1)
          fi
          if [ -f docs/references/OCR_DEPENDENCY_crossRepo.md ]; then
            DEPMAP_HASH=$(sha256sum docs/references/OCR_DEPENDENCY_crossRepo.md | cut -d' ' -f1)
          fi

          for REPO in $REPOS; do
            TOTAL_REPOS=$((TOTAL_REPOS + 1))
            REPO_STATUS=""
            REPO_FAIL=0
            REPO_WARN=0

            # --- DAC compliance: required files ---
            for FILE in CLAUDE.md README.md SKILL.md; do
              EXISTS=$(gh api "repos/$ORG/$REPO/contents/$FILE" --jq '.name' 2>/dev/null || echo "MISSING")
              if [ "$EXISTS" = "MISSING" ]; then
                REPO_STATUS+="  - :x: \`$FILE\` — **MISSING**\n"
                REPO_FAIL=$((REPO_FAIL + 1))
              else
                REPO_STATUS+="  - :white_check_mark: \`$FILE\`\n"
              fi
            done

            # --- CI presence: docs-ci workflow ---
            CI_EXISTS=$(gh api "repos/$ORG/$REPO/contents/.github/workflows/docs-ci.yml" --jq '.name' 2>/dev/null || echo "MISSING")
            if [ "$CI_EXISTS" = "MISSING" ]; then
              REPO_STATUS+="  - :warning: \`.github/workflows/docs-ci.yml\` — **no CI pipeline**\n"
              REPO_WARN=$((REPO_WARN + 1))
            else
              REPO_STATUS+="  - :white_check_mark: \`docs-ci.yml\`\n"
            fi

            # --- Standards drift: .ocr-standards/ directory ---
            OCR_STD=$(gh api "repos/$ORG/$REPO/contents/.ocr-standards" --jq '.[].name' 2>/dev/null || echo "MISSING")
            if [ "$OCR_STD" = "MISSING" ]; then
              REPO_STATUS+="  - :warning: \`.ocr-standards/\` — not present (propagate-standards has not run yet)\n"
              REPO_WARN=$((REPO_WARN + 1))
            else
              # Check if .ocr-standards/docs/OCR_VISION.md matches current
              REMOTE_VISION_HASH=$(gh api "repos/$ORG/$REPO/contents/.ocr-standards/docs/OCR_VISION.md" --jq '.sha' 2>/dev/null || echo "MISSING")
              if [ "$REMOTE_VISION_HASH" = "MISSING" ]; then
                REPO_STATUS+="  - :warning: \`.ocr-standards/docs/OCR_VISION.md\` — missing from standards dir\n"
                REPO_WARN=$((REPO_WARN + 1))
              else
                REPO_STATUS+="  - :white_check_mark: \`.ocr-standards/\` present\n"
              fi
            fi

            # --- Last activity ---
            LAST_COMMIT=$(gh api "repos/$ORG/$REPO/commits?per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || echo "unknown")
            LAST_COMMIT_SHORT=$(echo "$LAST_COMMIT" | cut -dT -f1)
            REPO_STATUS+="  - Last commit: \`$LAST_COMMIT_SHORT\`\n"

            # --- Open PRs ---
            OPEN_PRS=$(gh api "repos/$ORG/$REPO/pulls?state=open" --jq 'length' 2>/dev/null || echo "0")
            if [ "$OPEN_PRS" != "0" ]; then
              REPO_STATUS+="  - Open PRs: **$OPEN_PRS**\n"
            fi

            # --- Open propagation PRs specifically ---
            PROP_PRS=$(gh api "repos/$ORG/$REPO/pulls?state=open" --jq '[.[] | select(.head.ref | startswith("ocr-standards/"))] | length' 2>/dev/null || echo "0")
            if [ "$PROP_PRS" != "0" ]; then
              REPO_STATUS+="  - :rotating_light: **$PROP_PRS unmerged standards PR(s)** — review needed\n"
              REPO_WARN=$((REPO_WARN + 1))
            fi

            # --- Build repo section ---
            if [ "$REPO_FAIL" -gt 0 ]; then
              ICON=":x:"
            elif [ "$REPO_WARN" -gt 0 ]; then
              ICON=":warning:"
            else
              ICON=":white_check_mark:"
            fi

            REPORT+="### $ICON $REPO\n$REPO_STATUS\n"
            FAILURES=$((FAILURES + REPO_FAIL))
            WARNINGS=$((WARNINGS + REPO_WARN))
          done

          # --- Build summary ---
          SUMMARY="## Nightly Sync Check — $(date +%Y-%m-%d)\n\n"

          if [ "$FAILURES" -eq 0 ] && [ "$WARNINGS" -eq 0 ]; then
            SUMMARY+="**All $TOTAL_REPOS repos in sync.** No issues found.\n\n"
          else
            SUMMARY+="**$TOTAL_REPOS repos checked.** "
            if [ "$FAILURES" -gt 0 ]; then
              SUMMARY+="**$FAILURES failure(s).** "
            fi
            if [ "$WARNINGS" -gt 0 ]; then
              SUMMARY+="**$WARNINGS warning(s).** "
            fi
            SUMMARY+="\n\n"
          fi

          SUMMARY+="$REPORT"
          SUMMARY+="\n---\n"
          SUMMARY+="*Generated by nightly-sync-check workflow.*\n"
          SUMMARY+="*Run propagate-standards workflow to fix drift.*"

          echo -e "$SUMMARY" > /tmp/report.md

          # Output for next steps
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: steps.audit.outputs.failures != '0' || steps.audit.outputs.warnings != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Nightly Sync: ${{ steps.audit.outputs.failures }} failure(s), ${{ steps.audit.outputs.warnings }} warning(s) — $(date +%Y-%m-%d)"

          # Find any existing open nightly-sync issue
          EXISTING=$(gh issue list --label "nightly-sync" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          # The per-repo "### :icon: repo" section headers are the signal
          # that matters — they capture which repos are flagged and at what
          # severity. Incidental fields (last-commit date, open-PR counts)
          # are expected to shift run to run without the underlying drift
          # changing, so they are deliberately excluded from this comparison.
          NEW_SECTIONS=$(grep '^### ' /tmp/report.md || true)

          if [ -n "$EXISTING" ]; then
            EXISTING_BODY=$(gh issue view "$EXISTING" --json body --jq '.body' 2>/dev/null || echo "")
            EXISTING_SECTIONS=$(echo "$EXISTING_BODY" | grep '^### ' || true)

            if [ "$EXISTING_SECTIONS" = "$NEW_SECTIONS" ]; then
              # Same repos flagged, same severity — this is still-unresolved
              # drift (e.g. a standards PR still awaiting human review), not
              # a new finding. Fold into the existing issue instead of
              # closing it and opening a duplicate (never duplicate — fold
              # into the owner; see CLAUDE.md knowledge-homes reconciliation).
              gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/report.md
              gh issue comment "$EXISTING" --body "Still unresolved as of $(date +%Y-%m-%d) — same repos/status as the last run. Updated in place rather than opening a duplicate issue."
            else
              # The flagged repos or their severity actually changed — close
              # the stale issue and open a fresh one for the new findings.
              gh issue close "$EXISTING" --comment "Superseded by new nightly run — findings changed."
              gh issue create \
                --title "$TITLE" \
                --body-file /tmp/report.md \
                --label "nightly-sync"
            fi
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/report.md \
              --label "nightly-sync"
          fi

      - name: All clear — close any stale issue
        if: steps.audit.outputs.failures == '0' && steps.audit.outputs.warnings == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All repos in sync."
          cat /tmp/report.md

          # Drift tracked by a prior run may have been resolved since (e.g. a
          # spoke's standards PR got merged). If an open nightly-sync issue is
          # still sitting there from that run, close it instead of leaving it
          # open forever — the "All clear" path used to only log and never
          # touch any existing issue, so a resolved warning could go stale
          # indefinitely (see OCR-docs#114).
          EXISTING=$(gh issue list --label "nightly-sync" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All clear as of $(date +%Y-%m-%d) — every repo is back in sync. Closing automatically."
          fi
