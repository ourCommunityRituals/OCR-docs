# propagate-standards.yml
# When OCR-docs standards change, open PRs in all product repos
# to keep them in sync.
#
# Trigger: push to main that touches templates/ or docs/
# Action: for each product repo, open a PR with the updated templates
#         and a diff summary so the repo owner can review and merge.
#
# This does NOT auto-merge. Every repo gets a PR. Human gate applies.

name: Propagate Standards

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'skills/**'
      - 'docs/OCR_VISION.md'
      - 'docs/references/OCR_DEPENDENCY_crossRepo.md'
      - 'docs/standards/**'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repo list (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — log what would happen, no PRs'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

env:
  ORG: ourCommunityRituals
  # One STABLE propagation branch per spoke (no per-run timestamp). GitHub
  # permits at most one open PR per head branch, so a stable name makes "two
  # open propagation PRs per spoke" impossible by construction, and every run
  # re-syncs the FULL brain state onto this one branch so its open PR always
  # carries the complete cumulative delta — no sibling branch can strand a
  # hunk (the delta-drop this workflow used to risk; OCR-129).
  PROPAGATE_BRANCH: ocr-standards/propagate
  # All product repos that receive propagated standards
  ALL_REPOS: >-
    ourSharedEvents
    ourWKRP
    ourSharedGames
    ourSharedRecords
    ourSharedPulse
    ourSharedMagnets
    ourAirwaves

# Pin all `run:` steps to bash. ubuntu-24.04 already defaults to bash, but
# only an explicit `shell: bash` runs with `-o pipefail`, so a failure on
# the left of a pipe fails the step. Keep the pin.
defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    name: Detect what changed
    runs-on: ubuntu-24.04
    outputs:
      templates_changed: ${{ steps.changes.outputs.templates }}
      skills_changed: ${{ steps.changes.outputs.skills }}
      vision_changed: ${{ steps.changes.outputs.vision }}
      depmap_changed: ${{ steps.changes.outputs.depmap }}
      standards_changed: ${{ steps.changes.outputs.standards }}
      changed_files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        run: |
          DIFF=$(git diff --name-only HEAD~1 HEAD)
          echo "templates=false" >> "$GITHUB_OUTPUT"
          echo "skills=false" >> "$GITHUB_OUTPUT"
          echo "vision=false" >> "$GITHUB_OUTPUT"
          echo "depmap=false" >> "$GITHUB_OUTPUT"
          echo "standards=false" >> "$GITHUB_OUTPUT"

          if echo "$DIFF" | grep -q '^templates/'; then
            echo "templates=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -q '^skills/'; then
            echo "skills=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -q '^docs/OCR_VISION.md'; then
            echo "vision=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -q '^docs/references/OCR_DEPENDENCY_crossRepo.md'; then
            echo "depmap=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -q '^docs/standards/'; then
            echo "standards=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List changed files
        id: list
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | tr '\n' ', ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

  propagate:
    name: Open PRs in product repos
    needs: detect-changes
    runs-on: ubuntu-24.04
    # The write token is an environment secret, reachable only from main (OSE-1695).
    environment: main-automation
    strategy:
      fail-fast: false
      matrix:
        repo:
          - ourSharedEvents
          - ourWKRP
          - ourSharedGames
          - ourSharedRecords
          - ourSharedPulse
          - ourSharedMagnets
          - ourAirwaves
    steps:
      - name: Check if repo is in scope
        id: scope
        run: |
          INPUT_REPOS="${{ github.event.inputs.repos }}"
          REPO="${{ matrix.repo }}"

          if [ -z "$INPUT_REPOS" ]; then
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
          elif echo "$INPUT_REPOS" | grep -q "$REPO"; then
            echo "in_scope=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout OCR-docs
        if: steps.scope.outputs.in_scope == 'true'
        uses: actions/checkout@v4
        with:
          path: ocr-docs

      - name: Checkout target repo
        if: steps.scope.outputs.in_scope == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/${{ matrix.repo }}
          token: ${{ secrets.OCR_PROPAGATE_WRITE }}
          path: target

      - name: Build propagation summary
        if: steps.scope.outputs.in_scope == 'true'
        id: summary
        run: |
          SUMMARY="## Standards Propagation\n\n"
          SUMMARY+="**Source:** OCR-docs commit ${{ github.sha }}\n"
          SUMMARY+="**Changed:** ${{ needs.detect-changes.outputs.changed_files }}\n\n"

          if [ "${{ needs.detect-changes.outputs.templates_changed }}" = "true" ]; then
            SUMMARY+="### Templates updated\n"
            SUMMARY+="Base templates in \`OCR-docs/templates/\` have changed.\n"
            SUMMARY+="Review the updated templates and align this repo's files if needed.\n"
            SUMMARY+="Templates are reference — not auto-applied. Your repo's CLAUDE.md and SKILL.md are product-specific.\n\n"
          fi

          if [ "${{ needs.detect-changes.outputs.vision_changed }}" = "true" ]; then
            SUMMARY+="### VISION.md updated\n"
            SUMMARY+="The org-level source of truth has changed.\n"
            SUMMARY+="Review \`OCR-docs/docs/OCR_VISION.md\` and update this repo's references if needed.\n\n"
          fi

          if [ "${{ needs.detect-changes.outputs.skills_changed }}" = "true" ]; then
            SUMMARY+="### CCR skills updated\n"
            SUMMARY+="CCR protocol files in \`OCR-docs/skills/\` have changed.\n"
            SUMMARY+="Review the updated skills (ccr-protocol, ccr-template, ccr-mvp).\n\n"
          fi

          if [ "${{ needs.detect-changes.outputs.depmap_changed }}" = "true" ]; then
            SUMMARY+="### OCR_DEPENDENCY_crossRepo.md updated\n"
            SUMMARY+="Cross-repo dependencies have changed.\n"
            SUMMARY+="Review \`OCR-docs/docs/references/OCR_DEPENDENCY_crossRepo.md\` for dependencies affecting this repo.\n\n"
          fi

          if [ "${{ needs.detect-changes.outputs.standards_changed }}" = "true" ]; then
            SUMMARY+="### Org standards updated\n"
            SUMMARY+="Standards in \`OCR-docs/docs/standards/\` have changed.\n"
            SUMMARY+="This may include: naming convention, test naming, D1 migration standard, org brain sync.\n"
            SUMMARY+="Review the updated standards and align this repo's files on next meaningful touch.\n\n"
          fi

          SUMMARY+="---\n"
          SUMMARY+="*This PR was opened by the propagate-standards workflow in OCR-docs.*\n"
          SUMMARY+="*Review and merge — or close if no changes needed in this repo.*"

          # Write to file to avoid escaping issues
          echo -e "$SUMMARY" > /tmp/pr-body.md

      - name: Select propagation branch (dedup open PRs)
        if: steps.scope.outputs.in_scope == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.OCR_PROPAGATE_WRITE }}
        run: |
          git config user.name "OCR Standards Bot"
          git config user.email "noreply@ourcommunityrituals.com"

          # Is there already an OPEN propagation PR for this spoke? If so we
          # will APPEND this run's delta to that PR's branch instead of opening
          # a second one — that is the dedup (OCR-129). GitHub allows one open
          # PR per head, and $PROPAGATE_BRANCH is stable, so this is belt-and-
          # suspenders on top of the by-construction guarantee.
          OPEN_PR=$(gh pr list --repo "$ORG/${{ matrix.repo }}" \
            --head "$PROPAGATE_BRANCH" --state open \
            --json number --jq '.[0].number // ""')
          echo "OPEN_PR=$OPEN_PR" >> "$GITHUB_ENV"

          if [ -n "$OPEN_PR" ]; then
            # Build ON TOP of the open PR's branch so its prior delta is kept
            # and this run's delta is added — a fast-forward, no history rewrite.
            echo "Open propagation PR #$OPEN_PR found — will append to $PROPAGATE_BRANCH."
            git fetch origin "$PROPAGATE_BRANCH"
            git checkout -B "$PROPAGATE_BRANCH" "origin/$PROPAGATE_BRANCH"
          else
            # No open PR: base a fresh branch on the just-checked-out main.
            echo "No open propagation PR — will open one on $PROPAGATE_BRANCH."
            git checkout -B "$PROPAGATE_BRANCH" origin/main
          fi

      - name: Copy updated templates to target
        if: steps.scope.outputs.in_scope == 'true'
        run: |
          # Copy templates into a .ocr-standards/ reference directory
          # so the repo has the latest templates available locally
          mkdir -p target/.ocr-standards
          cp -r ocr-docs/templates/* target/.ocr-standards/

          # Copy CCR skills
          mkdir -p target/.ocr-standards/skills
          cp -r ocr-docs/skills/* target/.ocr-standards/skills/

          # Copy VISION.md reference
          mkdir -p target/.ocr-standards/docs
          cp ocr-docs/docs/OCR_VISION.md target/.ocr-standards/docs/OCR_VISION.md

          # Copy OCR_DEPENDENCY_crossRepo.md reference
          # Source moved to docs/references/ in OCR-docs; sibling destination
          # kept flat so existing repo layouts remain unchanged.
          cp ocr-docs/docs/references/OCR_DEPENDENCY_crossRepo.md target/.ocr-standards/docs/OCR_DEPENDENCY_crossRepo.md

          # Copy org standards
          mkdir -p target/.ocr-standards/standards
          cp -r ocr-docs/docs/standards/* target/.ocr-standards/standards/

      - name: Check for actual changes
        if: steps.scope.outputs.in_scope == 'true'
        id: diff
        working-directory: target
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run — log only
        if: |
          steps.scope.outputs.in_scope == 'true'
          && steps.diff.outputs.has_changes == 'true'
          && github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN: Would open PR in ${{ env.ORG }}/${{ matrix.repo }}"
          echo "Changed files in OCR-docs: ${{ needs.detect-changes.outputs.changed_files }}"
          cd target && git diff --cached --stat

      - name: Commit and open-or-append the propagation PR
        if: |
          steps.scope.outputs.in_scope == 'true'
          && steps.diff.outputs.has_changes == 'true'
          && github.event.inputs.dry_run != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.OCR_PROPAGATE_WRITE }}
        run: |
          # The branch ($PROPAGATE_BRANCH) was already selected in the dedup
          # step and staged in the diff step, so just commit the delta here.
          git commit -m "chore: propagate OCR-docs standards update

          Source: OCR-docs commit ${{ github.sha }}
          Changed: ${{ needs.detect-changes.outputs.changed_files }}

          Co-Authored-By: OCR Standards Bot <noreply@ourcommunityrituals.com>"

          if [ -n "$OPEN_PR" ]; then
            # APPEND to the existing open PR — never open a second one. Push is
            # a fast-forward onto the PR's own branch, so the PR now carries the
            # cumulative delta (OCR-129 dedup: one PR per spoke, no dropped hunk).
            git push origin "HEAD:$PROPAGATE_BRANCH"
            gh pr comment "$OPEN_PR" --repo "$ORG/${{ matrix.repo }}" --body \
              "Appended a newer OCR-docs standards delta (source \`${{ github.sha }}\`). This PR now carries the **cumulative** propagation delta; no separate PR was opened (OCR-129 dedup)."
          else
            # No open PR: drop any stale already-merged/closed branch ref (safe —
            # there is no open PR on it), push fresh, and open exactly one PR.
            git push origin --delete "$PROPAGATE_BRANCH" 2>/dev/null || true
            git push origin "HEAD:$PROPAGATE_BRANCH"
            gh pr create \
              --repo "$ORG/${{ matrix.repo }}" \
              --base main \
              --head "$PROPAGATE_BRANCH" \
              --title "chore: propagate OCR-docs standards update" \
              --body-file /tmp/pr-body.md
          fi

      - name: No changes needed
        if: |
          steps.scope.outputs.in_scope == 'true'
          && steps.diff.outputs.has_changes == 'false'
        run: |
          echo "No changes needed for ${{ matrix.repo }} — already in sync."
