# actions-selftest.yml
# ----------------------------------------------------------------------------
# Exercises the shared composite actions in .github/actions/ on every PR that
# touches them. A defect in an action.yml or a bundled checker is caught HERE,
# in OCR-docs, instead of in a spoke's pipeline.
#
# The jobs run on GitHub-hosted ubuntu-24.04, the runner every OCR workflow
# uses (the owner stopped self-hosting runners; statement of 2026-10-11), and
# invoke the composite actions for real. So this workflow also verifies the
# environment assumptions the actions depend on: action-path resolution and
# setup-python / setup-node inside a composite action. It is the automated
# form of CCR gate OCR_GATE_PR63 story G1.
#
# The actions still normalise a Windows-style action path (`pwd -W`, with a
# plain `pwd` fallback). No OCR job runs on Windows any more, so that branch
# is not exercised here; on Linux the fallback is the path under test.
#
# deploy-spoke is NOT exercised — it performs a real Cloudflare deploy. Its
# action.yml is structurally validated by the `metadata` job.
# ----------------------------------------------------------------------------
name: Actions self-test

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/actions-selftest.yml'
      - 'tests/validate_action_metadata.py'
      - 'tests/ci-selftest-fixture/**'
  workflow_dispatch:

concurrency:
  group: actions-selftest-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: action.yml metadata is valid
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install --disable-pip-version-check pyyaml
      - name: Validate every composite action
        run: python3 tests/validate_action_metadata.py

  universal:
    name: universal-checks against fixture
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run universal-checks
        uses: ./.github/actions/universal-checks
        with:
          # typecheck + lint left at their default (true) so the self-test
          # also exercises setup-node and the npm path on the runner. The
          # fixture's typecheck/lint scripts are no-ops.
          working-directory: tests/ci-selftest-fixture

  identity:
    name: identity-contract against fixture
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run identity-contract
        uses: ./.github/actions/identity-contract
        with:
          identity_mode: auto
          working-directory: tests/ci-selftest-fixture

  brain:
    name: brain-conformance against fixture
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run brain-conformance
        uses: ./.github/actions/brain-conformance
        with:
          # osm is marked code_present:false in the registry, so the brain
          # check SKIP-passes — this exercises the action wiring (Python
          # setup, deps, script, artifact upload) without needing a fully
          # conformant fixture.
          product-id: osm
          repo: tests/ci-selftest-fixture
