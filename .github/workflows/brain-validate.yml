name: Brain validate
on:
  pull_request:
    paths:
      - 'ocr-docs-brain/**'
      - '.github/workflows/brain-validate.yml'
      # The propagate-standards dedup lock (test_propagate_standards_dedup.py)
      # lives in ocr-docs-brain/tests, so run_script_tests picks it up here.
      # Trigger on the workflow it guards too, so a regression to a per-run
      # timestamped branch is caught even when no other brain file changes.
      - '.github/workflows/propagate-standards.yml'
      # The nightly-sync-check dedup lock (test_nightly_sync_dedup.py) lives
      # in ocr-docs-brain/tests too; trigger on the workflow it guards so a
      # regression to unconditional close+recreate is caught here.
      - '.github/workflows/nightly-sync-check.yml'
      # check_adr_edges.py reads the fleet ADRs' Enforced-by headers, so an
      # ADR edit must run the edge check too.
      - 'docs/adr/**'
  push:
    branches: [main]
    paths:
      - 'ocr-docs-brain/**'
      - '.github/workflows/brain-validate.yml'
      # The propagate-standards dedup lock (test_propagate_standards_dedup.py)
      # lives in ocr-docs-brain/tests, so run_script_tests picks it up here.
      # Trigger on the workflow it guards too, so a regression to a per-run
      # timestamped branch is caught even when no other brain file changes.
      - '.github/workflows/propagate-standards.yml'
      # The nightly-sync-check dedup lock (test_nightly_sync_dedup.py) lives
      # in ocr-docs-brain/tests too; trigger on the workflow it guards so a
      # regression to unconditional close+recreate is caught here.
      - '.github/workflows/nightly-sync-check.yml'
      # check_adr_edges.py reads the fleet ADRs' Enforced-by headers, so an
      # ADR edit must run the edge check too.
      - 'docs/adr/**'
  workflow_dispatch:

concurrency:
  group: brain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No pip cache: `pip install pyyaml packaging` is two tiny packages,
      # not worth the cache layer's complexity.
      - name: Install Brain pyramid deps
        shell: bash
        run: pip install --disable-pip-version-check pyyaml packaging
      - name: Run Brain pyramid
        shell: bash
        run: python3 ocr-docs-brain/tests/run_all.py

      # Script self-tests (test_*.py) lock the behavior of the helper scripts
      # in scripts/ that the spokes check out and run at runtime. run_all.py
      # only covers the conformance pyramid, so these are wired separately.
      # A defect in open_drift_ticket.py / check_brain_contract.py is caught
      # here in OCR-docs before any spoke pipeline runs it.
      - name: Run Brain script self-tests
        shell: bash
        run: python3 ocr-docs-brain/tests/run_script_tests.py

      # Two-sided ADR <-> invariant edge: every invariant's references.adr and
      # every ADR's Enforced-by declaration must agree, and the two debt lists
      # in adr-edge-ratchet.json may only shrink. Brain-internal, so it runs
      # here and not in check_brain_contract.py (which each spoke runs).
      - name: Check ADR to invariant edges
        shell: bash
        run: python3 ocr-docs-brain/scripts/check_adr_edges.py --brain ocr-docs-brain --repo-root . --ratchet ocr-docs-brain/adr-edge-ratchet.json
